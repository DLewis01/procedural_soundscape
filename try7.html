let samples = [];

let currentCleanSampleSource = null;

let currentCleanSampleName = "NONE";

/*
 * Put a samples.json in ./samples/ for reliable loading:
 *
 * [
 *   "rain.mp3",
 *   "traffic.mp3",
 *   "machinery.mp3"
 * ]
 */

async function loadSamples() {

    const status =
        document.getElementById(
            "sampleStatus"
        );

    samples = [];

    /*
     * First try manifest.
     */

    try {

        const response =
            await fetch(
                "./samples/samples.json",
                {
                    cache:"no-store"
                }
            );

        if (response.ok) {

            const list =
                await response.json();

            if (Array.isArray(list)) {

                samples =
                    list
                        .filter(
                            x =>
                                typeof x ===
                                "string"
                        )
                        .filter(
                            x =>
                                /\.mp3$/i
                                .test(x)
                        )
                        .map(
                            x =>
                                x.startsWith("./") ||
                                x.startsWith("/") ||
                                x.includes("/")
                                    ? x
                                    : "./samples/" + x
                        );

            }

        }

    }
    catch(e) {
        /*
         * Manifest is optional.
         */
    }


    /*
     * If manifest did not exist, try Apache
     * directory listing.
     */

    if (!samples.length) {

        try {

            const response =
                await fetch(
                    "./samples/",
                    {
                        cache:"no-store"
                    }
                );

            if (response.ok) {

                const html =
                    await response.text();

                const doc =
                    new DOMParser()
                        .parseFromString(
                            html,
                            "text/html"
                        );

                const links =
                    [...doc.querySelectorAll("a")];

                samples =
                    links
                        .map(
                            a =>
                                a.getAttribute("href")
                        )
                        .filter(Boolean)
                        .filter(
                            href =>
                                /\.mp3$/i
                                .test(href)
                        )
                        .map(
                            href =>
                                "./samples/" +
                                href
                        );

            }

        }
        catch(e) {
            /*
             * Directory listing may be disabled.
             */
        }

    }


    if (!samples.length) {

        status.textContent =
            "Samples: none found — use ./samples/samples.json";

        sampleScanDone = true;

        return;

    }


    status.textContent =
        `Samples: ${samples.length} found — loading...`;


    for (
        const url of samples
    ) {

        try {

            const response =
                await fetch(
                    url
                );

            if (!response.ok)
                continue;

            const data =
                await response.arrayBuffer();

            const buffer =
                await audioContext.decodeAudioData(
                    data
                );

            sampleBuffers.push(
                buffer
            );

            sampleNames.push(
                decodeURIComponent(
                    url.split("/").pop()
                )
            );

        }
        catch(error) {

            console.warn(
                "Could not load sample:",
                url,
                error
            );

        }

    }


    sampleScanDone = true;

    status.textContent =
        `Samples: ${sampleBuffers.length} loaded`;

}


/* =========================================================
   RANDOM
========================================================= */

function random(min,max) {

    return min +
        Math.random() *
        (max-min);

}


function randomInt(min,max) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );

}


function choose(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remaining =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");

    return `${minutes}:${remaining}`;

}

/* =========================================================
   AUDIO INITIALISATION
========================================================= */

function resizeWaveformCanvas() {

    if (!waveformCanvas)
        return;

    const rect =
        waveformCanvas.getBoundingClientRect();

    const dpr =
        Math.max(
            1,
            Math.min(
                2,
                window.devicePixelRatio || 1
            )
        );

    waveformCanvas.width =
        Math.max(
            1,
            Math.floor(rect.width * dpr)
        );

    waveformCanvas.height =
        Math.max(
            1,
            Math.floor(rect.height * dpr)
        );

    waveformContext.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function drawWaveform() {

    if (!waveformAnalyser ||
        !waveformCanvas ||
        !waveformContext ||
        !waveformData) {
        return;
    }

    const width =
        waveformCanvas.clientWidth;

    const height =
        waveformCanvas.clientHeight;

    if (!width || !height)
        return;

    waveformAnalyser.getByteTimeDomainData(
        waveformData
    );

    waveformContext.clearRect(
        0,
        0,
        width,
        height
    );

    waveformContext.strokeStyle =
        "#6f9294";

    waveformContext.lineWidth =
        1;

    waveformContext.beginPath();

    const sliceWidth =
        width / waveformData.length;

    let x = 0;

    for (
        let i = 0;
        i < waveformData.length;
        i++
    ) {

        const v =
            waveformData[i] / 128;

        const y =
            (v * height) / 2;

        if (i === 0) {
            waveformContext.moveTo(
                x,
                y
            );
        }
        else {
            waveformContext.lineTo(
                x,
                y
            );
        }

        x += sliceWidth;

    }

    waveformContext.stroke();

    drawSpectrum();

    waveformAnimation =
        requestAnimationFrame(
            drawWaveform
        );

}


function resizeSpectrumCanvas() {

    if (!spectrumCanvas)
        return;

    const rect =
        spectrumCanvas.getBoundingClientRect();

    const dpr =
        Math.max(
            1,
            Math.min(
                2,
                window.devicePixelRatio || 1
            )
        );

    spectrumCanvas.width =
        Math.max(
            1,
            Math.floor(rect.width * dpr)
        );

    spectrumCanvas.height =
        Math.max(
            1,
            Math.floor(rect.height * dpr)
        );

    spectrumContext.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function drawSpectrum() {

    if (!waveformAnalyser ||
        !spectrumCanvas ||
        !spectrumContext ||
        !spectrumData) {
        return;
    }

    const width =
        spectrumCanvas.clientWidth;

    const height =
        spectrumCanvas.clientHeight;

    if (!width || !height)
        return;

    waveformAnalyser.getByteFrequencyData(
        spectrumData
    );

    spectrumContext.clearRect(
        0,
        0,
        width,
        height
    );

    const barCount =
        Math.min(
            96,
            spectrumData.length
        );

    const barWidth =
        width / barCount;

    spectrumContext.fillStyle =
        "#6f9294";

    for (let i = 0; i < barCount; i++) {

        const dataIndex =
            Math.floor(
                i *
                spectrumData.length /
                barCount
            );

        const value =
            spectrumData[dataIndex] / 255;

        const barHeight =
            value * height;

        spectrumContext.fillRect(
            i * barWidth,
            height - barHeight,
            Math.max(1, barWidth - 1),
            barHeight
        );

    }

}


function startWaveformDisplay() {

    if (!waveformCanvas)
        return;

    resizeWaveformCanvas();

    if (waveformAnimation)
        cancelAnimationFrame(
            waveformAnimation
        );

    drawWaveform();

}


function stopWaveformDisplay() {

    if (waveformAnimation) {

        cancelAnimationFrame(
            waveformAnimation
        );

        waveformAnimation = null;

    }

}


window.addEventListener(

    () => {

async function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        master =
            audioContext.createGain();

function createImpulseResponse(
    seconds,
    decay
) {

    const length =
        Math.floor(
            audioContext.sampleRate *
            seconds
        );

    const buffer =
        audioContext.createBuffer(
            2,
            length,
            audioContext.sampleRate
        );


    for (
        let channel = 0;
        channel < 2;
        channel++
    ) {

        const data =
            buffer.getChannelData(
                channel
            );

        for (
            let i=0;
            i<length;
            i++
        ) {

            const envelope =
                Math.pow(
                    1 -
                    i / length,
                    decay
                );

            data[i] =
                (
                    Math.random()*2-1
                ) *
                envelope;

        }

    }


    return buffer;

}


/* =========================================================
   SOURCE TRACKING / HARD STOP
========================================================= */

function trackSource(source) {

    activeSources.add(source);

    source.addEventListener(
        "ended",
        () => {
            activeSources.delete(source);
        },
        { once:true }
    );

    return source;

}


function stopAllSources() {

    for (const source of activeSources) {

        try {
            source.stop();
        }
        catch(error) {
            /* Already stopped. */
        }

    }

    activeSources.clear();

}

function playRandomSample(
    when
) {

    if (!wetSamplesEnabled.checked)
        return;

    if (!sampleBuffers.length)
        return;

    const chance =
        Number(sampleFrequency.value) / 100;

    if (Math.random() > chance)
        return;

    const sampleIndex =
        randomInt(
            0,
            sampleBuffers.length - 1
        );

    const buffer =
        sampleBuffers[sampleIndex];

    const sampleName =
        sampleNames[sampleIndex] ||
        "UNKNOWN";

    const source = trackSource(
        audioContext.createBufferSource()
    );

    const gain =
        audioContext.createGain();

    const filter =
        audioContext.createBiquadFilter();

    source.buffer = buffer;

    source.playbackRate.value =
        random(0.78,1.18);

    filter.type = "lowpass";
    filter.frequency.value =
        random(900,6500);
    filter.Q.value =
        random(0.5,4);

	//wet sample playback duration
    const duration =
        Math.min(
            buffer.duration / source.playbackRate.value,
            30
        );


    //wet sample volume range
    const level =
        random(0.2,0.40);

    gain.gain.setValueAtTime(
        0.0001,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        level,
        when + Math.min(0.8,duration * 0.25)
    );

    gain.gain.setValueAtTime(
        level,
        when + Math.max(0.9,duration - 2)
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);

    source.addEventListener(
        "ended",
        () => {
            if (currentWetSampleSource === source) {
                currentWetSampleSource = null;
                currentWetSampleName = "NONE";
                updatePlaybackStatus();
            }
        },
        { once:true }
    );

    currentWetSampleSource = source;
    currentWetSampleName = sampleName;

    logPlayback(
        "WET SAMPLE",
        sampleName,
        when,
        { playbackRate: source.playbackRate.value }
    );

    source.start(when);
    source.stop(when + duration);

    updatePlaybackStatus();

}

/* =========================================================
   CLEAN / FOREGROUND SAMPLE PLAYBACK
========================================================= */

function playCleanSample(
    when
) {

    if (!drySamplesEnabled.checked)
        return;

    if (!sampleBuffers.length)
        return;

    const chance =
        Number(cleanSampleFrequency.value) / 100;

    if (Math.random() > chance)
        return;

    const sampleIndex =
        randomInt(
            0,
            sampleBuffers.length - 1
        );

    const buffer =
        sampleBuffers[sampleIndex];

    const sampleName =
        sampleNames[sampleIndex] ||
        "UNKNOWN";

    const source = trackSource(
        audioContext.createBufferSource()
    );

    const gain =
        audioContext.createGain();

    source.buffer = buffer;

    source.playbackRate.value =
        random(0.92,1.06);

    /*
     * Clean means no atmospheric filter, delay or reverb.
     * It is deliberately foregrounded, but still has a
     * short envelope so it never clicks into existence.
     */
    const duration =
        buffer.duration /
        source.playbackRate.value;

    const fadeIn =
        Math.min(0.12,duration * 0.08);

    const fadeOut =
        Math.min(0.5,duration * 0.18);

    //dry sample volume
    const level =
        random(0.35,0.55);

    gain.gain.setValueAtTime(
        0.0001,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        level,
        when + Math.max(0.02,fadeIn)
    );

    gain.gain.setValueAtTime(
        level,
        when + Math.max(
            fadeIn + 0.02,
            duration - fadeOut
        )
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );

    source.connect(gain);
    gain.connect(cleanMaster);

    source.addEventListener(
        "ended",
        () => {
            if (currentCleanSampleSource === source) {
                currentCleanSampleSource = null;
                currentCleanSampleName = "NONE";
                updatePlaybackStatus();
            }
        },
        { once:true }
    );

    currentCleanSampleSource = source;
    currentCleanSampleName = sampleName;

    logPlayback(
        "DRY SAMPLE",
        sampleName,
        when,
        { playbackRate: source.playbackRate.value }
    );

    source.start(when);
    source.stop(when + duration);

    updatePlaybackStatus();

}

function midiToFrequency(midi) {

    return 440 *
        Math.pow(
            2,
            (midi - 69) / 12
        );

}

const VOICE_ROLES = {
    brass:  { osc1:"sawtooth", osc2:"sawtooth", osc3:"triangle", detune1:-5, detune2:5, cutoff:1.00, resonance:1.00 },
    rachel: { osc1:"sine",     osc2:"sawtooth", osc3:"triangle", detune1:-3, detune2:3, cutoff:1.55, resonance:0.72 },
    choir:  { osc1:"triangle", osc2:"sine",     osc3:"triangle", detune1:-10,detune2:10,cutoff:0.78, resonance:0.55 },
    drone:  { osc1:"sawtooth", osc2:"triangle", osc3:"sine",     detune1:-2, detune2:2, cutoff:0.62, resonance:0.80 },
    spinner:{ osc1:"square",   osc2:"sawtooth", osc3:"triangle", detune1:-5, detune2:5, cutoff:1.35, resonance:1.45 },
    tears:  { osc1:"triangle", osc2:"sawtooth", osc3:"sine",     detune1:-4, detune2:4, cutoff:0.70, resonance:0.48 },
    scream: { osc1:"sawtooth", osc2:"square",   osc3:"sawtooth", detune1:-12,detune2:12,cutoff:1.80, resonance:2.10 }
};

function playVoice(
    midi,
    when,
    duration,
    velocity = 0.12,
    expressive = true,
    role = "brass",
    tuneArticulation = false
) {

//DL

    const debugWhen = Number(when);

    if (!Number.isFinite(debugWhen) || debugWhen < 0) {
        console.error(
            "[INVALID PLAYVOICE TIME]",
            {
                when: when,
                debugWhen: debugWhen,
                audioContextTime: audioContext
                    ? audioContext.currentTime
                    : null,
                midi: midi,
                duration: duration
            }
        );

        return;
    }



    const voice = VOICE_ROLES[role] || VOICE_ROLES.brass;

    const frequency =
        midiToFrequency(
            midi
        );


    const osc1 = trackSource(
        audioContext.createOscillator()
    );

    const osc2 = trackSource(
        audioContext.createOscillator()
    );

    const osc3 = trackSource(
        audioContext.createOscillator()
    );


    const filter =
        audioContext.createBiquadFilter();

    const gain =
        audioContext.createGain();


    osc1.type = voice.osc1;
    osc2.type = voice.osc2;
    osc3.type = voice.osc3;


    osc1.frequency.value =
        frequency;

    osc2.frequency.value =
        frequency;

    osc3.frequency.value =
        frequency;


    osc1.detune.value = voice.detune1;
    osc2.detune.value = voice.detune2;
    osc3.detune.value = 0;


    /*
     * Slow pitch instability.
     */

    if (expressive) {

        const lfo = trackSource(
            audioContext.createOscillator()
        );

        const lfoGain =
            audioContext.createGain();

        lfo.frequency.value =
            random(
                0.12,
                0.55
            );

        lfoGain.gain.value =
            random(
                1.5,
                7
            );

        lfo.connect(
            lfoGain
        );

        lfoGain.connect(
            osc1.detune
        );

        lfoGain.connect(
            osc2.detune
        );

        lfo.start(
            when
        );

        lfo.stop(
            when +
            duration +
            2
        );

    }


    /*
     * Filter movement.
     */

    const tensionAmount =
        Number(
            tension.value
        ) / 100;


    const startCutoff =
        (350 + tensionAmount * 1000) * voice.cutoff;


    const peakCutoff =
        (900 + tensionAmount * 6000) * voice.cutoff;


    filter.type =
        "lowpass";

    filter.frequency.setValueAtTime(
        startCutoff,
        when
    );


    filter.frequency.exponentialRampToValueAtTime(
        Math.max(
            250,
            peakCutoff
        ),
        when +
        Math.min(
            duration * 0.65,
            2.5
        )
    );


    filter.frequency.exponentialRampToValueAtTime(
        Math.max(
            220,
            peakCutoff * 0.65
        ),
        when +
        duration
    );


    filter.Q.value =
        (1.5 + tensionAmount * 8) * voice.resonance;


    /*
     * Long expressive envelope.
     */

    let attack =
        0.12 +
        random(
            0,
            0.9
        );

if (tuneArticulation) {
    attack =
        Math.min(
            attack,
            Math.max(
                0.025,
                duration * 0.22
            )
        );
}




    let release =
        0.7 +
        random(
            0,
            2.2
        );

if (tuneArticulation) {
    release =
        Math.min(
            release,
            Math.max(
                0.05,
                duration * 0.28
            )
        );
}

    const peak =
        velocity *
        (
            0.75 +
            Number(
                activity.value
            ) / 180
        );


    gain.gain.setValueAtTime(
        0.0001,
        when
    );


    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.001,
            peak
        ),
        when + attack
    );


    gain.gain.setValueAtTime(
        peak,
        Math.max(
            when + attack,
            when + duration - release
        )
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );


    /*
     * Expressive pitch bend.
     */

    if (expressive) {

        const bend =
            random(
                -22,
                22
            );


        osc1.detune.setValueAtTime(
            -5 + bend,
            when
        );

        osc1.detune.exponentialRampToValueAtTime(
            -5,
            when + 0.45
        );


        osc2.detune.setValueAtTime(
            5 + bend,
            when
        );

        osc2.detune.exponentialRampToValueAtTime(
            5,
            when + 0.45
        );

    }


    osc1.connect(
        filter
    );

    osc2.connect(
        filter
    );

    osc3.connect(
        filter
    );

    filter.connect(
        gain
    );

    gain.connect(
        master
    );


    osc1.start(
        when
    );

    osc2.start(
        when
    );

    osc3.start(
        when
    );


    const stopTime =
        when +
        duration +
        release +
        0.1;


    osc1.stop(
        stopTime
    );

    osc2.stop(
        stopTime
    );

    osc3.stop(
        stopTime
    );

}

function closestNote(
    pitch,
    previous
) {

    let result =
        pitch;

    while (
        result -
        previous >
        6
    ) {

        result -=
            12;

    }

    while (
        previous -
        result >
        6
    ) {

        result +=
            12;

    }

    return result;

}


function makeChord(
    scene,
    chord
) {

    const root =
        scene.root;


    const raw =
        chord.map(
            interval =>
                root +
                interval
        );


    if (!lastChord) {

        return [
            raw[0],
            raw[1] + 12,
            raw[2] + 12
        ];

    }


    const result = [];


    for (
        let i=0;
        i<raw.length;
        i++
    ) {

        result.push(
            closestNote(
                raw[i],
                lastChord[
                    i
                ]
            )
        );

    }


    result.sort(
        (a,b) =>
            a-b
    );


    return result;

}


/* =========================================================
   LONG MUSICAL PHRASES
========================================================= */

/*
 * The phrase is now an actual musical object.
 *
 * Each event has:
 *
 * pitch
 * duration in beats
 * rest
 * accent
 *
 * A small motif is created first, then transformed
 * across several phrase sections.
 */

function generateMotif(
    scene
) {

    const scale =
        scene.scale;


    const motifLength =
        randomInt(
            4,
            8
        );


    const motif = [];


    let currentDegree =
        randomInt(
            0,
            scale.length - 1
        );


    for (
        let i=0;
        i<motifLength;
        i++
    ) {

        /*
         * Mostly small melodic steps.
         */

        const movement =
            choose([
                -2,
                -1,
                0,
                0,
                1,
                1,
                2
            ]);


        currentDegree =
            Math.max(
                0,
                Math.min(
                    scale.length - 1,
                    currentDegree +
                    movement
                )
            );


        motif.push(
            scale[
                currentDegree
            ]
        );

    }


    return motif;

}


function phase2RegisterShift(scene) {

    const tensionAmount = Number(tension.value) / 100;
    const activityAmount = Number(activity.value) / 100;

    const choices =
        tensionAmount > 0.70
        ? [-12, 0, 0, 12, 12]
        : activityAmount < 0.30
            ? [-12, -12, 0, 0, 12]
            : [-12, 0, 0, 0, 12];

    return choose(choices);

}

function phase2Velocity(sectionIndex, sectionCount, eventIndex, eventCount, base) {

    const position =
        (sectionIndex + eventIndex / Math.max(1, eventCount)) /
        Math.max(1, sectionCount);

    /* A broad swell with a little phrase-level variation. */
    const swell =
        0.72 +
        0.48 * Math.sin(Math.PI * position);

    const local =
        0.88 +
        Math.random() * 0.24;

    return base * swell * local;

}

function generatePhrase(
    scene
) {

    const motif =
        generateMotif(
            scene
        );


    const events = [];


    /*
     * 4 to 8 repetitions/variations
     * gives a much longer phrase.
     */

    /* Phase 2: phrase lengths are deliberately less predictable. */
    const sections =
        randomInt(
            3,
            7
        );

    const registerShift = phase2RegisterShift(scene);

    let lastPitch =
        scene.root +
        12 +
        registerShift;


    for (
        let section=0;
        section<sections;
        section++
    ) {

        /* Phase 2: breathe between phrase sections. */
        if (
            section > 0 &&
            Math.random() < 0.42
        ) {
            events.push({
                rest:true,
                beats:choose([0.5, 1, 1.5, 2])
            });
        }

        /*
         * Each section transforms the motif.
         */

        const transpose =
            choose([
                0,
                0,
                0,
                12,
                -12
            ]);


        const reverse =
            section >= 4 &&
            Math.random() <
            0.25;


        const source =
            reverse
            ? [...motif].reverse()
            : motif;


        for (
            let i=0;
            i<source.length;
            i++
        ) {

            /*
             * Silence becomes more likely
             * as activity falls.
             */

            const activityAmount =
                Number(
                    activity.value
                ) / 100;


            if (
                Math.random() >
                0.48 +
                activityAmount * 0.48
            ) {

                events.push({
                    rest:true,
                    beats:
                        choose([
                            0.5,
                            1,
                            1.5
                        ])
                });

                continue;

            }


            let pitch =
                scene.root +
                source[i] +
                transpose +
                registerShift;


            /*
             * Keep the melody around the
             * current register.
             */

            while (
                pitch -
                lastPitch >
                9
            ) {

                pitch -=
                    12;

            }


            while (
                lastPitch -
                pitch >
                9
            ) {

                pitch +=
                    12;

            }


            /*
             * Occasional expressive leap.
             */

            if (
                Math.random() <
                Number(
                    tension.value
                ) / 400
            ) {

                pitch +=
                    choose([
                        -12,
                        12
                    ]);

            }


            const duration =
                choose([
                    0.5,
                    0.75,
                    1,
                    1,
                    1.5,
                    2,
                    2.5,
                    3
                ]);


            events.push({
                pitch,
                beats:duration,
                accent:
                    Math.random() <
                    0.18,
                intensity:
                    phase2Velocity(
                        section,
                        sections,
                        i,
                        source.length,
                        1
                    )
            });


            lastPitch =
                pitch;


            /*
             * Occasionally add a
             * simultaneous harmony tone.
             */

            if (
                Math.random() <
                0.12
            ) {

                events.push({
                    pitch:
                        pitch +
                        choose([
                            3,
                            4,
                            7,
                            12
                        ]),
                    beats:
                        Math.min(
                            duration,
                            2
                        ),
                    accent:false,
                    harmony:true,
                    intensity:0.72
                });

            }

        }

    }


    /*
     * Cadential ending.
     */

    events.push({
        rest:true,
        beats:1
    });


    events.push({
        pitch:
            scene.root +
            12,
        beats:4,
        accent:true
    });


    return events;

}

function updateLongFormArc() {
    musicalMemory.chapterBar++;

    const activityAmount = Number(activity.value) / 100;
    const tensionAmount = Number(tension.value) / 100;
    const age = musicalMemory.arcAge;

    /* The arc is deliberately slow. It should be felt over many bars,
       not behave like another random bar-by-bar selector. */
    let next = musicalMemory.chapter;

    if (age < 12) {
        next = "introduction";
    } else if (age < 28) {
        next = "establishment";
    } else if (age < 52) {
        next = "development";
    } else if (age < 76) {
        next = "intensification";
    } else if (age < 94) {
        next = "climax";
    } else if (age < 116) {
        next = "dissipation";
    } else {
        next = "return";
    }

    /* User controls can bend the arc without replacing it. */
    if (tensionAmount > 0.82 && age > 36 && age < 92)
        next = age > 60 ? "climax" : "intensification";

    if (activityAmount < 0.20 && age > 70 && age < 116)
        next = "dissipation";

    if (next !== musicalMemory.chapter) {
        musicalMemory.chapter = next;
        musicalMemory.chapterNumber++;
        musicalMemory.chapterBar = 0;

        /* A chapter change develops the existing idea instead of discarding it. */
        if (musicalMemory.motif) {
            musicalMemory.motifUses = Math.min(
                musicalMemory.motifUses,
                1
            );
            musicalMemory.motifGenerations++;
        }
    }

    return musicalMemory.chapter;
}

function longFormProfile() {
    switch (musicalMemory.chapter) {
        case "introduction":
            return { density:0.62, motif:0.78, response:0.18, ostinato:0.22, chromatic:0.05 };
        case "establishment":
            return { density:0.82, motif:0.88, response:0.28, ostinato:0.34, chromatic:0.08 };
        case "development":
            return { density:1.00, motif:1.05, response:0.44, ostinato:0.50, chromatic:0.14 };
        case "intensification":
            return { density:1.12, motif:0.94, response:0.58, ostinato:0.72, chromatic:0.25 };
        case "climax":
            return { density:1.25, motif:0.78, response:0.70, ostinato:0.86, chromatic:0.42 };
        case "dissipation":
            return { density:0.58, motif:0.66, response:0.24, ostinato:0.18, chromatic:0.06 };
        case "return":
            return { density:0.76, motif:1.18, response:0.36, ostinato:0.26, chromatic:0.08 };
        default:
            return { density:1, motif:1, response:0.3, ostinato:0.3, chromatic:0.1 };
    }
}

function longFormMotifMode() {
    switch (musicalMemory.chapter) {
        case "introduction": return "original";
        case "establishment": return choose(["original","fragment","transpose"]);
        case "development": return choose(["fragment","transpose","stretch","answer"]);
        case "intensification": return choose(["transpose","answer","stretch"]);
        case "climax": return choose(["transpose","answer","answer"]);
        case "dissipation": return choose(["fragment","stretch","original"]);
        case "return": return choose(["original","transpose","fragment"]);
        default: return chooseMotifDevelopment();
    }
}

function rememberSource(name) {
    musicalMemory.sourceHistory.push(name);
    if (musicalMemory.sourceHistory.length > 6)
        musicalMemory.sourceHistory.shift();
}

function rememberedSource() {
    return musicalMemory.motif;
}

function chooseMotifDevelopment() {
    return choose([
        "original",
        "original",
        "fragment",
        "transpose",
        "transpose",
        "stretch",
        "answer"
    ]);
}

function chooseVoiceRole() {
    const roles = ["brass", "rachel", "choir", "drone", "spinner", "tears", "scream"];
    const role = roles[musicalMemory.voiceIndex % roles.length];
    musicalMemory.voiceIndex++;
    musicalMemory.lastRole = role;
    return role;
}

function chooseResponseRole(role) {
    const handoff = {
        brass:"rachel", rachel:"choir", choir:"brass",
        drone:"tears", tears:"rachel", spinner:"brass", scream:"choir"
    };
    return handoff[role] || "rachel";
}

function makeCallResponse(source) {
    const callCount = Math.max(4, Math.ceil(source.length * 0.55));
    const call = source.slice(0, callCount).map(e => ({...e}));
    const answer = source.slice(Math.floor(source.length * 0.35)).map(e => ({
        ...e,
        beat: (e.beat - source[Math.floor(source.length * 0.35)].beat) +
              (call[call.length - 1]?.beat || 0) + 1.5,
        midi: e.midi + choose([-5, -2, 2, 5])
    }));
    return { call, answer };
}

function developMidiEvents(source, mode) {
    let events = source.map(e => ({...e}));

    if (mode === "fragment") {
        const count = Math.max(5, Math.floor(events.length * random(0.55, 0.75)));
        events = events.slice(0, count);
    }

    if (mode === "answer") {
        events = events.slice(Math.floor(events.length * 0.25));
    }

    if (mode === "stretch") {
        events = events.map(e => ({
            ...e,
            beat: e.beat * 1.12,
            duration: e.duration * 1.12
        }));
    }

    return events;
}

function chooseRememberedMotif() {
    if (!musicalMemory.motif)
        return null;

    /* Memory becomes less reliable with repeated use, but does not
       disappear immediately. This gives a remembered idea time to
       become a fragment, recollection and response before fading. */
    if (musicalMemory.motifUses >= 4 && Math.random() < 0.45)
        return null;

    return musicalMemory.motif;
}

function rememberMotif(name, source) {
    musicalMemory.motif = {
        name,
        source: source.map(e => ({...e})),
        uses: 0
    };
    musicalMemory.motifUses = 0;
}

function chooseRememberedMotifMode() {
    switch (musicalMemory.motifUses) {
        case 0:
            return choose(["fragment","fragment","transpose"]);
        case 1:
            return choose(["fragment","transpose","stretch"]);
        case 2:
            return choose(["transpose","transpose","answer"]);
        case 3:
            return choose(["answer","fragment","stretch"]);
        default:
            return choose(["fragment","transpose","answer"]);
    }
}

function nextHarmonicIndex(scene) {
    if (musicalMemory.harmonyScene !== currentScene) {
        musicalMemory.harmonyScene = currentScene;
        /* Don't restart blindly: begin near the chord implied by the
           last voiced harmony when possible. */
        musicalMemory.lastHarmonyIndex =
            musicalMemory.lastHarmonyIndex % scene.chords.length;
    } else {
        musicalMemory.lastHarmonyIndex =
            (musicalMemory.lastHarmonyIndex + 1) % scene.chords.length;
    }

    return musicalMemory.lastHarmonyIndex;
}

        return "falling";

    threshold += bias.night;
    if (roll < threshold)
        return "night";

    return "distant";
}
*/


//experimental tunes
function chooseTuneIdentity(sceneName=currentScene) {

    const bias =
        TUNE_SCENE_BIAS[sceneName] ||
        TUNE_SCENE_BIAS.rain;

    // Only consider entries that have both a profile and a source array.
    const entries = Object.entries(bias).filter(([kind, weight]) => {
        const profile = TUNE_IDENTITY[kind];
        return Number(weight) > 0 &&
            !!profile &&
            Array.isArray(MIDI_SOURCE[profile.source]) &&
            MIDI_SOURCE[profile.source].length > 0;
    });

    if (!entries.length)
        return "main";

    // Normalize against the sum of all weights. This is important now
    // that many Reverie tunes have been added; otherwise later entries
    // could never be selected once the cumulative sum exceeds 1.
    const totalWeight = entries.reduce(
        (sum, [, weight]) => sum + Number(weight),
        0
    );

    let roll = Math.random() * totalWeight;

    for (const [kind, weight] of entries) {
        roll -= Number(weight);
        if (roll < 0)
            return kind;
    }

    return entries[entries.length - 1][0];
}

function scheduleTuneResidue(scene, when, pitches, role, kind) {

    /* A tune can occasionally leave behind a very small recollection.
       This is deliberately sparse: it is not another melody or a loop. */
    if (!pitches || pitches.length < 2)
        return;

    if (Math.random() > 0.28)
        return;

    const beatDuration = 60 / Number(tempo.value);

    const residueProfiles = {
        rain:      { delay: [3.5,7.0], count:[1,2], roles:["tears","drone"], velocity:[0.010,0.016] },
        city:      { delay: [2.0,4.5], count:[1,2], roles:["rachel","choir"], velocity:[0.009,0.014] },
        memory:    { delay: [2.0,5.0], count:[1,2], roles:["rachel","brass"], velocity:[0.012,0.019] },
        rachel:    { delay: [2.5,5.5], count:[1,2], roles:["rachel","tears"], velocity:[0.011,0.018] },
        spinner:   { delay: [1.5,3.5], count:[1,2], roles:["spinner","rachel"], velocity:[0.007,0.012] },
        replicant: { delay: [2.0,4.0], count:[1,2], roles:["choir","brass"], velocity:[0.008,0.014] },
        tyrell:    { delay: [4.0,8.0], count:[1,2], roles:["drone","tears"], velocity:[0.008,0.014] },
        tears:     { delay: [4.5,9.0], count:[1,2], roles:["tears","drone"], velocity:[0.006,0.011] }
    };

    const profile =
        residueProfiles[currentScene] || residueProfiles.rain;

    const count =
        randomInt(profile.count[0], profile.count[1]);

    const delayBars =
        random(profile.delay[0], profile.delay[1]);

    const residueRole =
        choose(profile.roles);

    const residueVelocity =
        random(profile.velocity[0], profile.velocity[1]);

    /* Prefer notes from the latter half of the tune. Those tend to feel
       like a recollection of what has just disappeared. */
    const start = Math.floor(pitches.length * 0.45);
    const candidates = pitches.slice(start);

    for (let i=0; i<count; i++) {
        const pitch =
            candidates[Math.floor(Math.random() * candidates.length)];

        const noteDelay =
            delayBars * 4 * beatDuration +
            i * random(0.45,1.25) * beatDuration;

        const duration =
            beatDuration * random(1.25,3.25);

        playVoice(
            pitch,
            when + noteDelay,
            duration,
            residueVelocity * random(0.82,1.08),
            true,
            residueRole
        );
    }
}

function scheduleMidiMainMotif(
    scene,
    when,
    lower=false,
    forcedMode=null,
    identity=null,
    frequencyAlreadyChecked=false
) {

    /*
     * The recognisable upper tune is treated as an event.
     * For MAIN MELODY, preserve the actual MIDI note sequence:
     *   - no fragment
     *   - no answer
     *   - no stretch
     *   - no harmonic snapping
     *   - no interval correction
     *
     * The tune is still transposed into the current scene/register,
     * and the existing expressive voice is retained.
     */

    if (!lower && !frequencyAlreadyChecked) {

        if (!tunesEnabled.checked)
            return;

        const frequencyAmount =
            Number(tuneFrequency.value) / 100;

        if (frequencyAmount <= 0)
            return;

        if (audioContext && when < tuneActiveUntil)
            return;

        if (Math.random() > frequencyAmount)
            return;
    }

    const kind =
        identity ||
        (lower ? "lower" : "main");

    const profile =
        TUNE_IDENTITY[kind] ||
        TUNE_IDENTITY.main;

    const baseSource =
        MIDI_SOURCE[profile.source];

    /*
     * Memory can still bring back a previous MAIN MELODY,
     * but we do not subsequently transform it.
     */
    const remembered =
        !lower && kind === "main"
            ? chooseRememberedMotif()
            : null;

    let source =
        remembered
            ? remembered.source
            : baseSource;

    /*
     * Only non-main identities retain the existing
     * developmental transformations.
     */
    if (!profile.preserve && kind !== "main") {

        const mode =
            forcedMode ||
            chooseMotifDevelopment();

        source =
            developMidiEvents(
                source,
                mode
            );
    }

    if (!source || !source.length)
        return;

    /*
     * Keep this outside the conditional so it remains valid
     * when used later for tuneActiveUntil and residue timing.
     */
    let finalBeat = 0;

    if (!lower) {

        finalBeat =
            Math.max(
                ...source.map(
                    event =>
                        event.beat +
                        event.duration
                )
            );

        tuneActiveUntil =
            when +
            finalBeat *
            (60 / Number(tempo.value)) +
            0.5;

        const tuneNames = {
            main: "MAIN MELODY",
            lower: "LOWER RESPONSE",
            counter: "COUNTER MELODY",
            falling: "FALLING MEMORY",
            night: "NIGHT DRIVE",
            distant: "DISTANT SIGNAL",
            pickUpThePieces: "PICK UP THE PIECES",
            fanfareCommonMan: "FANFARE FOR THE COMMON MAN",
            takeFive: "TAKE FIVE",
            toccataFugue: "TOCCATA AND FUGUE",
            takeOnMe: "TAKE ON ME",
            blueMonday: "BLUE MONDAY"
        };

        currentTuneName =
            tuneNames[kind] ||
            String(kind).toUpperCase();

        currentTuneScene =
            SCENES[currentScene]
                ? SCENES[currentScene].name
                : currentScene;

        currentTuneStart =
            when;

        logPlayback(
            "TUNE",
            currentTuneName,
            when,
            {
                sceneName: currentTuneScene,
                identity: kind,
                durationBeats: finalBeat
            }
        );
        updatePlaybackStatus();

        window.setTimeout(() => {

            if (
                audioContext &&
                audioContext.currentTime >=
                    tuneActiveUntil - 0.05 &&
                currentTuneStart === when
            ) {

                currentTuneName =
                    "NONE";

                currentTuneScene =
                    "NONE";

                currentTuneStart =
                    0;

                updatePlaybackStatus();
            }

        },
        Math.max(
            0,
            (tuneActiveUntil -
             audioContext.currentTime) * 1000
        ) + 100);
    }

    /*
     * Transpose the tune so its first note sits in the
     * appropriate register for the current scene.
     *
     * This changes the KEY/REGISTER, not the melody.
     */
    const sourceAnchor =
        source[0].midi;

    const targetAnchor =
        scene.root +
        profile.anchor;

    const transpose =
        targetAnchor -
        sourceAnchor +
        choose([-12,0,0,0,12]);

    const beatDuration =
        60 / Number(tempo.value);

    const tensionAmount =
        Number(tension.value) / 100;

    const activityAmount =
        Number(activity.value) / 100;

    const role =
        choose(profile.roles);

    let previousPitch =
        null;

    const playedPitches =
        [];
//DL
    const debugEvents =
    [];

    source.forEach(
        (event, index) => {

            let pitch =
                event.midi +
                transpose;

            /*
             * MAIN MELODY:
             *
             * Do NOT pass through harmonicApproachMidi().
             *
             * This preserves every original interval in the
             * supplied MIDI melody.
             *
             * Other identities continue to use the existing
             * harmonic treatment.
             */
            if (!profile.preserve && kind !== "main") {

                pitch =
                    harmonicApproachMidi(
                        pitch,
                        scene,

                    );
            }

            previousPitch =
                pitch;

            playedPitches.push(
                pitch
            );

            const duration =
                event.duration *

            const position =
                index /
                Math.max(

                    source.length - 1
                );

            const swell =
                0.72 +

                Math.sin(
                    Math.PI *
                    position
                );

            /*
             * Give MAIN MELODY a slightly more immediate
             * entrance so the recognisable phrase can actually
             * emerge from the atmosphere.
             */
            const entryFade =
                kind === "main"
                    ? Math.min(
                        1,
                        0.58 +
                        position * 1.8
                    )
                    : lower
                        ? 1
                        : Math.min(
                            1,
                            0.22 +
                            position * 3.9
                        );

            const velocity =
                profile.velocity *
                entryFade *
                swell *
                (
                    0.90 +
                    activityAmount * 0.20 +
                    tensionAmount * 0.12
                ) *
                (
                    index ===
                    source.length - 1
                        ? 1.12
                        : 1
                );


//DL
debugEvents.push({
    sourceMidi: event.midi,
    midi: pitch,
    beat: event.beat,
    duration: duration,
    velocity: velocity
});


            playVoice(
                pitch,
                when +
                    event.beat *
                    beatDuration,
                Math.max(
                    0.18,
                    duration
                ),
                velocity,
                true,
                role,
		true
            );
        }
    );


//DL
    if (
        kind !== "main" &&
        profile.preserve
    ) {
        debugTunePlayback(
            kind,
            profile,
            source,
            transpose,
            debugEvents,
            scene
        );
    }





    if (!lower) {

        scheduleTuneResidue(
            scene,
            when +
                finalBeat *
                beatDuration,
            playedPitches,
            role,
            kind
        );
    }

    /*
     * Continue feeding the musical-memory system exactly as before.
     */
    if (!lower && kind === "main") {

        if (!remembered) {

            rememberMotif(
                "mainMotif",

            );

        } else if (
            Math.random() < 0.35
        ) {

            musicalMemory.motif.source =
                source.map(

        }

        musicalMemory.motifUses++;

        /*
         * Keep recording the fact that the tune appeared,

        rememberSource(

            createdAtBar: bar
