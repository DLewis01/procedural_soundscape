    }
}






function scheduleMidiOstinato(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose = scene.root - 43;

    /* Four bars of the source ostinato, with occasional missing steps. */
    for (let step=0; step<64; step++) {

        if (step > 7 && Math.random() < 0.08)
            continue;

        const sourcePitch =
            MIDI_SOURCE.ostinato[step % 4];

        playVoice(
            sourcePitch + transpose,
            when + step * beatDuration * 0.25,
            beatDuration * 0.18,
            0.022 + (step % 4 === 0 ? 0.014 : 0),
            false
        );

    }
}

function scheduleMidiCounterMelody(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.counterMelody;

    /* Put the counter-line below the main phrase and move it by octave
       rather than forcing it to follow every chord. */
    const transpose =
        (scene.root + 7) - source[0].midi +
        choose([-12,0,0,12]);

    let previousPitch = null;

    source.forEach((event,index) => {

        if (index > 7 && Math.random() < 0.14)
            return;

        const pitch = harmonicApproachMidi(
            event.midi + transpose,
            scene,
            previousPitch
        );

        previousPitch = pitch;

        playVoice(
            pitch,
            when + event.beat * beatDuration,
            event.duration * beatDuration * random(0.92,1.06),
            0.032 + (index === 0 ? 0.008 : 0),
            true
        );

    });
}

function scheduleMidiBassMovement(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.bassMovement;
    const transpose = scene.root - source[0];

    source.forEach((midi,index) => {

        playVoice(
            midi + transpose,
            when + index * beatDuration * 0.5,
            beatDuration * random(0.28,0.48),
            0.035 + (index % 2 === 0 ? 0.012 : 0),
            false
        );

    });
}

function scheduleMidiRhythmLayer(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.rhythmCell;
    const durationShape = MIDI_SOURCE.durationShape;
    const transpose = scene.root + 12;

    let cursor = when;

    for (let i=0; i<source.length; i++) {

        const note =
            transpose +
            choose(scene.scale) +
            choose([0,12]);

        const spacing = source[i] * beatDuration;
        const duration =
            durationShape[i % durationShape.length] *
            beatDuration * 0.12;

        playVoice(
            note,
            cursor,
            Math.max(0.12, Math.min(duration, spacing * 0.8)),
            0.018 + (i === 0 ? 0.012 : 0),
            false
        );

        cursor += spacing;

    }
}

function scheduleMidiExpressive(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose =
        (scene.root + 45) - MIDI_SOURCE.expressiveHigh[0].midi;

    MIDI_SOURCE.expressiveHigh.forEach((event, index) => {

        playVoice(
            event.midi + transpose,
            when + event.beat * beatDuration,
            event.duration * beatDuration * random(0.75,1.15),
            0.025 + (index / MIDI_SOURCE.expressiveHigh.length) * 0.018,
            true
        );

    });
}

function scheduleMidiChromatic(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose =
        (scene.root + 48) - MIDI_SOURCE.chromaticRun[0];

    MIDI_SOURCE.chromaticRun.forEach((midi,index) => {

        playVoice(
            midi + transpose,
            when + index * beatDuration * 0.0625,
            beatDuration * 0.075,
            0.012,
            true
        );

    });
}


function scheduleMidiDNA(scene, when) {

    const activityAmount =
        Number(activity.value) / 100;

    const tensionAmount =
        Number(tension.value) / 100;

    const profile =
        sceneProfile(currentScene);

    const arc =
        longFormProfile();

    /*
     * Activity, Tension, Scene and the long-form arc still determine
     * whether this bar is eligible for MIDI-derived material.
     */
    const sourceChance =
        Math.min(
            0.92,
            (
                0.14 +
                activityAmount * 0.30 +
                tensionAmount * 0.18
            ) *
            profile.midi *
            profile.density *
            arc.density
        );

    if (
        bar % 2 !== 0 ||
        Math.random() > sourceChance
    )
        return;

    midiSourceEventCounter++;

    /*
     * Tune Frequency now controls the tune decision directly.
     * There is no second hidden Tune Frequency roll inside
     * scheduleMidiMainMotif() for this path.
     */
    const tuneChance =
        Number(tuneFrequency.value) / 100;

    if (
        tunesEnabled.checked &&
        tuneChance > 0 &&
        Math.random() < tuneChance &&
        !(audioContext &&
          when < tuneActiveUntil)
    ) {

        const tuneKind =
            chooseTuneIdentity(
                currentScene
            );

        scheduleMidiMainMotif(
            scene,
            when,
            false,
            longFormMotifMode(),
            tuneKind,
            true
        );

        return;
    }

    /*
     * Musical memory can still bring back the main motif,
     * but this remains part of the general MIDI vocabulary.
     */
    const remembered =
        chooseRememberedMotif();

    if (
        remembered &&
        Math.random() <
            0.34 * arc.motif
    ) {

        scheduleMidiMainMotif(
            scene,
            when,
            false,
            longFormMotifMode()
        );

        return;
    }

    const roll =
        Math.random();

    const cityLike =
        currentScene === "city" ||
        currentScene === "spinner" ||
        currentScene === "replicant";

    if (
        cityLike &&
        roll < 0.30 * profile.midi
    ) {

        scheduleMidiOstinato(
            scene,
            when
        );

    } else if (
        roll < 0.55 * profile.midi
    ) {

        scheduleMidiBassMovement(
            scene,
            when
        );

    } else {

        scheduleMidiRhythmLayer(
            scene,
            when
        );
    }

    /*
     * Busy scenes can answer a phrase with a second voice.
     */
    if (
        activityAmount > 0.55 &&
        Math.random() <
            0.12 +
            activityAmount * 0.20
    ) {

        scheduleMidiCounterMelody(
            scene,
            when +
                beatDurationForScore() *
                choose([2,3,4])
        );
    }

    /*
     * Phase 4B: a remembered call can return as an answer
     * in another voice.
     */
    if (
        musicalMemory.callResponse &&
        activityAmount > 0.42 &&
        Math.random() <
            (
                0.16 +
                activityAmount * 0.16
            ) *
            arc.response
    ) {

        const response =
            makeCallResponse(
                musicalMemory.callResponse.source
            );

        const responseRole =
            chooseResponseRole(
                musicalMemory.callResponse.role
            );

        const responseStart =
            when +
            beatDurationForScore() *
            choose([2,3,4]);

        const anchor =
            response.answer[0]?.midi ||
            response.source?.[0]?.midi ||
            72;

        const transpose =
            (
                scene.root +
                choose([7,12,19])
            ) -
            anchor;

        response.answer.forEach(
            (event,index) => {

                playVoice(
                    event.midi +
                        transpose,
                    responseStart +
                        event.beat *
                        beatDurationForScore(),
                    Math.max(
                        0.16,
                        event.duration *
                        beatDurationForScore() *
                        random(0.88,1.05)
                    ),
                    0.048 +
                        (
                            index ===
                            response.answer.length - 1
                                ? 0.012
                                : 0
                        ),
                    true,
                    responseRole
                );
            }
        );

        musicalMemory.callResponse =
            null;
    }

    /*
     * Long-form development can bring the source ostinato forward
     * during the build.
     */
    if (
        (
            musicalMemory.chapter ===
                "intensification" ||
            musicalMemory.chapter ===
                "climax"
        ) &&
        Math.random() <
            arc.ostinato * 0.18
    ) {

        scheduleMidiOstinato(
            scene,
            when +
                beatDurationForScore() * 2
        );
    }

    /*
     * Upper expressive material becomes more probable
     * as tension rises.
     */
    if (
        tensionAmount > 0.45 &&
        Math.random() <
            (
                tensionAmount - 0.30
            ) * 0.35
    ) {

        scheduleMidiExpressive(
            scene,
            when +
                beatDurationForScore() *
                random(0,2)
        );
    }

    /*
     * Chromatic material remains reserved for high tension.
     */
    if (
        tensionAmount > 0.80 &&
        Math.random() <
            0.20 +
            arc.chromatic * 0.25
    ) {

        scheduleMidiChromatic(
            scene,
            when +
                beatDurationForScore() * 2
        );
    }
}










/* =========================================================
   PHASE 6 — HARMONIC ARCHITECTURE
========================================================= */

/*
 * MIDI-derived material remains the source vocabulary, but ordinary
 * melodic events are now gently constrained to the active scene scale.
 * This prevents a transformed motif from accidentally introducing
 * unrelated chromatic notes simply because it was transposed.
 *
 * Chromatic material is deliberately NOT passed through this function;
 * the chromatic layer remains an intentional high-tension colour.
 */
function harmonicSnapMidi(midi, scene) {

    const pitchClass = ((Math.round(midi) % 12) + 12) % 12;

    const allowed = scene.scale.map(
        degree => ((scene.root + degree) % 12 + 12) % 12
    );

    if (allowed.includes(pitchClass))
        return midi;

    let best = midi;
    let bestDistance = Infinity;

    for (const targetClass of allowed) {
        for (let octave=-1; octave<=1; octave++) {
            const candidate =
                midi +
                ((targetClass - pitchClass + 12) % 12) +
                octave * 12;

            const distance = Math.abs(candidate - midi);

            if (distance < bestDistance) {
                best = candidate;
                bestDistance = distance;
            }
        }
    }

    return best;
}


function harmonicApproachMidi(midi, scene, previousMidi=null) {

    let pitch = harmonicSnapMidi(midi, scene);

    if (previousMidi !== null) {
        while (pitch - previousMidi > 7)
            pitch -= 12;

        while (previousMidi - pitch > 7)
            pitch += 12;
    }

    return pitch;
}


function scheduleChapterCadence(scene, when) {

    const chapter = musicalMemory.chapter;

    if (
        musicalMemory.chapterBar !== 1 ||
        !["establishment","development","intensification","climax","dissipation","return"].includes(chapter)
    ) {
        return;
    }

    const beat = beatDurationForScore();
    const root = scene.root;

    /* Quiet fifth-to-root arrival marks a new long-form chapter. */
    playVoice(
        root + 7,
        when,
        beat * 1.8,
        0.035,
        false,
        "tears"
    );

    playVoice(
        root,
        when + beat * 2,
        beat * 3.5,
        0.048,
        false,
        "brass"
    );
}


function beatDurationForScore() {
    return 60 / Number(tempo.value);
}


/* =========================================================
   PHRASE STATE
========================================================= */

let phrase = [];

let phraseIndex = 0;

let phraseTime = 0;


function ensurePhrase(
    scene
) {

    if (
        !phrase.length ||
        phraseIndex >=
        phrase.length
    ) {

        phrase =
            generatePhrase(
                scene
            );

        phraseIndex = 0;

        phraseTime = 0;

    }

}


/* =========================================================
   PLAY PHRASE EVENTS
========================================================= */

function schedulePhrase(
    scene,
    startTime
) {

    ensurePhrase(
        scene
    );


    /*
     * Schedule a substantial section
     * rather than one note.
     */

    let cursor =
        startTime;


    const eventsToSchedule =
        Math.min(
            10,
            phrase.length -
            phraseIndex
        );


    const beatDuration =
        60 /
        Number(
            tempo.value
        );


    for (
        let i=0;
        i<eventsToSchedule;
        i++
    ) {

        const event =
            phrase[
                phraseIndex++
            ];


        const duration =
            event.beats *
            beatDuration;


        if (
            !event.rest
        ) {

            const velocity =
                (event.accent ? 0.17 : 0.10) *
                (event.intensity || 1);

            /* Phase 2: leave a little more space around long notes. */
            const gate =
                event.beats >= 2
                ? random(0.76, 0.92)
                : random(0.84, 0.97);

            playVoice(
                event.pitch,
                cursor,
                Math.max(
                    0.3,
                    duration * gate
                ),
                velocity,
                true
            );

        }


        cursor +=
            duration;

    }

}


/* =========================================================
   CHORD
========================================================= */

function playChord(
    scene,
    when
) {

    const chordIndex = nextHarmonicIndex(scene);
    const chord = scene.chords[chordIndex];


    const voiced =
        makeChord(
            scene,
            chord
        );


    lastChord =
        voiced;


    voiced.forEach(
        (pitch,index) => {

            playVoice(
                pitch,
                when,
                7.5 +
                index * 0.5,
                0.055,
                true
            );

        }
    );

}


/* =========================================================
   DRONE
========================================================= */

function playDrone(
    scene,
    when
) {

    playVoice(
        scene.root - 12,
        when,
        11,
        0.055,
        false
    );

}


/* =========================================================
   PULSE
========================================================= */

function playPulse(
    scene,
    when
) {

    const chance =
        Number(
            activity.value
        ) / 100;


    if (
        Math.random() >
        chance * 0.45
    )
        return;


    const note =
        scene.root +
        choose(
            scene.scale
        );


    playVoice(
        note + 12,
        when,
        choose([
            0.25,
            0.35,
            0.5
        ]),
        0.045,
        false
    );

}


/* =========================================================
   BAR
========================================================= */

function scheduleBar(
    scene,
    when
) {

    const beatDuration = 60 / Number(tempo.value);
    const profile = sceneProfile(currentScene);
    const activityAmount = Number(activity.value) / 100;
    const tensionAmount = Number(tension.value) / 100;
    updateLongFormArc();
    const arc = longFormProfile();

    /*
     * BACKGROUND TUNES
     *
     * This controls the generated musical layer as a whole:
     * chords, phrases, drones, pulses and MIDI-derived material.
     */
    if (backgroundEnabled.checked) {

        scheduleChapterCadence(
            scene,
            when
        );

        /* Harmony becomes more active as tension rises, while the spacious
           scenes leave more room between chord changes. */
        const chordChance = Math.min(0.98,
            profile.chord * (0.42 + tensionAmount * 0.38)
        );

        if (Math.random() < chordChance &&
            (bar % 2 === 0 || tensionAmount > 0.72)) {
            playChord(scene, when);
        }

        /* Activity controls foreground density. */
        const phraseChance = Math.min(1,
            profile.phrase * (0.48 + activityAmount * 0.62)
        );

        if (Math.random() < phraseChance) {
            schedulePhrase(scene, when);
        }

        /* Long drone foundation is strongest in low-activity scenes. */
        const droneChance = Math.min(0.95,
            profile.drone * (0.32 + (1 - activityAmount) * 0.48)
        );

        if (bar % 4 === 0 && Math.random() < droneChance) {
            playDrone(scene, when);
        }

        /* Mechanical pulse becomes a genuine scene characteristic. */
        const pulseChance = Math.min(1,
            profile.pulse * (0.12 + activityAmount * 0.72)
        );

        const pulseCount =
            activityAmount > 0.75 ? 8 :
            activityAmount > 0.42 ? 5 : 2;

        for (let i=0; i<pulseCount; i++) {
            if (Math.random() < pulseChance) {
                playPulse(
                    scene,
                    when + i * beatDuration / 2
                );
            }
        }

        scheduleMidiDNA(scene, when);

        /* During a transition, let the incoming scene appear as a restrained
           harmonic/melodic presence before it takes over completely. */
        if (sceneTransition && sceneTransition.barsRemaining > 0) {

            const incoming = SCENES[sceneTransition.to];
            const transitionStrength =
                (5 - sceneTransition.barsRemaining) / 5;

            /*
             * Do not stack the incoming scene's full chord over the outgoing
             * chord.  Their roots can be unrelated, and the long CS-80 chord
             * envelopes would otherwise overlap and create unintended
             * dissonance.  The transition is carried by the MIDI material
             * instead; the first full incoming chord arrives on its own bar.
             */
            if (Math.random() < transitionStrength * 0.65) {
                scheduleMidiDNA(
                    incoming,
                    when + beatDuration * 2
                );
            }

            sceneTransition.barsRemaining--;

            if (sceneTransition.barsRemaining <= 0) {
                sceneTransition = null;
                phrase = [];
                phraseIndex = 0;
                lastChord = null;
            }
        }
    }

    /* Wet atmospheric samples remain sparse and probabilistic. */
    if (sampleBuffers.length) {
        playRandomSample(
            when + random(0, beatDuration * 4)
        );
    }

    /* Phase 5: keep the global arc moving independently of scene changes. */
    musicalMemory.arcAge++;

    /* Clean foreground samples remain sparse. */
    if (sampleBuffers.length && bar % randomInt(2,8) === 0) {
        playCleanSample(
            when + random(beatDuration * 0.5, beatDuration * 3.5)
        );
    }

    bar++;
}


/* =========================================================
   SCENE CHANGES
========================================================= */

function chooseDifferentScene() {

    const keys =
        Object.keys(
            SCENES
        );


    const choices =
        keys.filter(
            key =>
                key !==
                currentScene
        );


    return choose(
        choices
    );

}


function randomiseControls() {

    activity.value =
        randomInt(
            15,
            80
        );


    tension.value =
        randomInt(
            10,
            85
        );


    tempo.value =
        randomInt(
            40,
            78
        );


    updateUI();

}


function changeScene(
    sceneName,
    randomise=true
) {

    if (!SCENES[sceneName])
        return;

    const previousScene = currentScene;

    /* Random scene changes get a four-bar musical transition. */
    if (running && previousScene !== sceneName) {
        sceneTransition = {
            from: previousScene,
            to: sceneName,
            barsRemaining: 4
        };
    }

    currentScene = sceneName;

    if (audioContext) {
        logPlayback(
            "SCENE",
            SCENES[sceneName] ? SCENES[sceneName].name : sceneName,
            audioContext.currentTime,
            { sceneKey: sceneName }
        );
    }

    if (randomise)
        randomiseControls();

    phrase = [];
    phraseIndex = 0;
    phraseTime = 0;
    bar = 0;
    tuneActiveUntil = 0;

    /* Keep musical memory across scenes. A motif can therefore return in a
       new register or harmony instead of every scene starting from zero. */
    musicalMemory.motifUses = Math.min(musicalMemory.motifUses, 2);
    musicalMemory.harmonyScene = null;
    musicalMemory.arcSceneCount++;
    musicalMemory.lastChapterScene = sceneName;
    /* Scene changes influence the arc, but do not reset it. */
    musicalMemory.arcAge += 1;

    /* Let an established idea survive several scene changes, but occasionally
       retire it so the score can develop a genuinely new musical identity. */
    if (musicalMemory.arcSceneCount >= 5 && Math.random() < 0.35) {
        musicalMemory.motif = null;
        musicalMemory.motifUses = 0;
        musicalMemory.callResponse = null;
        musicalMemory.arcSceneCount = 0;
    }

    nextSceneAt =
        Date.now() + Number(sceneInterval.value) * 1000;

    updatePlaybackStatus();

}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduler() {

    if (!running)
        return;


    const lookAhead =
        0.20;


    while (
        nextNoteTime <
        audioContext.currentTime +
        lookAhead
    ) {


        /*
         * Random scene mode.
         */

        if (
            sceneSelect.value ===
            "random" &&
            Date.now() >=
            nextSceneAt
        ) {

            changeScene(
                chooseDifferentScene(),
                true
            );

        }


        const scene =
            SCENES[
                currentScene
            ];


        scheduleBar(
            scene,
            nextNoteTime
        );


        const barDuration =
            (
                60 /
                Number(
                    tempo.value
                )
            ) * 4;


        nextNoteTime +=
            barDuration;

    }


    meter.style.width =
        `${
            8 +
            Math.random() *
            Number(
                activity.value
            )
        }%`;


    schedulerTimer =
        setTimeout(
            scheduler,
            30
        );

}


/* =========================================================
   MP3 RECORDING FUNCTIONS
========================================================= */

function resetRecordingBuffers() {
    recordingLeft = [];
    recordingRight = [];
    recordingSamples = 0;
}

function floatTo16BitPCM(float32) {
    const output = new Int16Array(float32.length);

    for (let i = 0; i < float32.length; i++) {
        const sample = Math.max(-1, Math.min(1, float32[i]));
        output[i] = sample < 0
            ? sample * 0x8000
            : sample * 0x7FFF;
    }

    return output;
}

function startRecording() {
    if (!audioContext || !running) {
        console.warn("[BR SCORE] Start the score before recording.");
        return;
    }

    if (!window.lamejs) {
        console.error("[BR SCORE] lamejs is not available; MP3 recording cannot start.");
        status.textContent = "MP3 ENCODER NOT AVAILABLE";
        return;
    }

    resetRecordingBuffers();
    recordingSampleRate = audioContext.sampleRate;
    recordingActive = true;

    recordButton.textContent = "STOP & SAVE MP3";
    recordButton.classList.add("playing");

    logPlayback(
        "RECORDER",
        "START",
        audioContext.currentTime
    );
}

function saveRecordedMP3() {
    if (!recordingSamples) {
        console.warn("[BR SCORE] No recorded audio to save.");
        return;
    }

    const left = new Int16Array(recordingSamples);
    const right = new Int16Array(recordingSamples);
    let offset = 0;

    for (let i = 0; i < recordingLeft.length; i++) {
        const l = floatTo16BitPCM(recordingLeft[i]);
        const r = floatTo16BitPCM(recordingRight[i]);
        left.set(l, offset);
        right.set(r, offset);
        offset += l.length;
    }

    const encoder =
        new lamejs.Mp3Encoder(
            2,
            recordingSampleRate,
            128
        );

    const mp3Data = [];
    const blockSize = 1152;

    for (let i = 0; i < left.length; i += blockSize) {
        const leftBlock = left.subarray(i, Math.min(i + blockSize, left.length));
        const rightBlock = right.subarray(i, Math.min(i + blockSize, right.length));
        const mp3buf = encoder.encodeBuffer(leftBlock, rightBlock);

        if (mp3buf.length > 0)
            mp3Data.push(new Int8Array(mp3buf));
    }

    const end = encoder.flush();

    if (end.length > 0)
        mp3Data.push(new Int8Array(end));

    const blob =
        new Blob(
            mp3Data,
            { type: "audio/mpeg" }
        );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    const stamp =
        new Date()
            .toISOString()
            .replace(/[:.]/g, "-");

    link.href = url;
    link.download = `blade-runner-score-${stamp}.mp3`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        5000
    );

    console.log(
        `[BR SCORE] MP3 saved: ${(blob.size / 1048576).toFixed(2)} MB`
    );
}

function stopRecording(save=true) {
    if (!recordingActive && !recordingSamples)
        return;

    recordingActive = false;

    recordButton.textContent = "RECORD MP3";
    recordButton.classList.remove("playing");

    if (audioContext) {
        logPlayback(
            "RECORDER",
            "STOP",
            audioContext.currentTime,
            { samples: recordingSamples }
        );
    }

    if (save && recordingSamples)
        saveRecordedMP3();
}


/* =========================================================
   START
========================================================= */

async function startScore() {

    await initAudio();

    master.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    master.gain.setValueAtTime(
        0.30,
        audioContext.currentTime
    );

    cleanMaster.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    cleanMaster.gain.setValueAtTime(
        0.80,
        audioContext.currentTime
    );


    /*
     * Load samples after the AudioContext
     * exists, but don't block playback.
     */

    if (
        !sampleScanDone
    ) {

        loadSamples();

    }


    running = true;

    scoreStartAudioTime = audioContext.currentTime;
    scoreStartWallTime = Date.now();
    playbackLog.length = 0;

    console.log("[BR SCORE] Playback log started");

    recordButton.disabled = false;

    startWaveformDisplay();


    startButton.textContent =
        "STOP INFINITE SCORE";


    status.classList.add(
        "playing"
    );


    /*
     * Random is deliberately the default.
     */

    if (
        sceneSelect.value ===
        "random"
    ) {

        changeScene(
            chooseDifferentScene(),
            true
        );

    }
    else {

        changeScene(
            sceneSelect.value,
            false
        );

    }


    nextNoteTime =
        audioContext.currentTime +
        0.10;


    scheduler();

}


/* =========================================================
   STOP
========================================================= */

function stopScore() {

    if (recordingActive || recordingSamples)
        stopRecording(true);

    recordButton.disabled = true;

    running = false;

    stopWaveformDisplay();
    tuneActiveUntil = 0;

    if (schedulerTimer) {

        clearTimeout(
            schedulerTimer
        );

        schedulerTimer = null;

    }

    /*
     * Cancel everything already scheduled. AudioScheduledSourceNode.stop()
     * with no argument stops an already-started source immediately, and a
     * source scheduled for the future will never begin if its stop occurs
     * first.
     */
    stopAllSources();

    if (audioContext) {

        const now =
            audioContext.currentTime;

        if (master) {
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(0,now);
        }

        if (cleanMaster) {
            cleanMaster.gain.cancelScheduledValues(now);
            cleanMaster.gain.setValueAtTime(0,now);
        }

    }

    nextNoteTime = 0;
    bar = 0;
    lastChord = null;

    currentWetSampleSource = null;
    currentCleanSampleSource = null;
    currentWetSampleName = "NONE";
    currentCleanSampleName = "NONE";

    currentTuneName = "NONE";
    currentTuneScene = "NONE";
    currentTuneStart = 0;
    tuneActiveUntil = 0;

    startButton.textContent =
        "START INFINITE SCORE";

    status.textContent =
        "STOPPED";

    status.classList.remove(
        "playing"
    );

    meter.style.width =
        "0%";

}

/* =========================================================
   START / STOP BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        if (
            running
        ) {

            stopScore();

        }
        else {

            try {

                await startScore();

            }
            catch(error) {

                console.error(
                    error
                );

                running = false;
                recordButton.disabled = true;

                startButton.textContent =
                    "START INFINITE SCORE";

                status.textContent =
                    "ERROR: " +
                    error.message;

            }

        }

    }
);


recordButton.addEventListener(
    "click",
    () => {
        if (recordingActive)
            stopRecording(true);
        else
            startRecording();
    }
);


/* =========================================================
   NEW SCENE
========================================================= */

document
    .getElementById(
        "newSceneButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                sceneSelect.value ===
                "random"
            ) {

                changeScene(
                    chooseDifferentScene(),
                    true
                );

            }
            else {

                changeScene(
                    sceneSelect.value,
                    false
                );

            }

        }
    );


/* =========================================================
   MANUAL SCENE SELECTION
========================================================= */

sceneSelect.addEventListener(
    "change",
    () => {

        if (
            sceneSelect.value ===
            "random"
        ) {

            changeScene(
                chooseDifferentScene(),
                true
            );

        }
        else {

            changeScene(
                sceneSelect.value,
                false
            );

        }

    }
);



/* =========================================================
   INITIAL STATE
========================================================= */

changeScene(
    "rain",
    false
);

</script>
