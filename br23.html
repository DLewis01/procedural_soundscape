/* =========================================================

========================================================= */

let audioContext = null;

let reverb = null;

/* =========================================================
   SAMPLE SYSTEM
========================================================= */

let samples = [];

let sampleBuffers = [];

let sampleNames = [];

let currentWetSampleSource = null;
let currentCleanSampleSource = null;

let currentWetSampleName = "NONE";
let currentCleanSampleName = "NONE";

let sampleScanDone = false;


/*
 * Put a samples.json in ./samples/ for reliable loading:
 *
 * [
 *   "rain.mp3",
 *   "traffic.mp3",
 *   "machinery.mp3"
 * ]
 */

async function loadSamples() {

    const status =
        document.getElementById(
            "sampleStatus"
        );

    samples = [];

    /*
     * First try manifest.
     */

    try {

        const response =
            await fetch(
                "./samples/samples.json",
                {
                    cache:"no-store"
                }
            );

        if (response.ok) {

            const list =
                await response.json();

            if (Array.isArray(list)) {

                samples =
                    list
                        .filter(
                            x =>
                                typeof x ===
                                "string"
                        )
                        .filter(
                            x =>
                                /\.mp3$/i
                                .test(x)
                        );

            }

        }

    }
    catch(e) {
        /*
         * Manifest is optional.
         */
    }


    /*
     * If manifest did not exist, try Apache
     * directory listing.
     */

    if (!samples.length) {

        try {

            const response =
                await fetch(
                    "./samples/",
                    {
                        cache:"no-store"
                    }
                );

            if (response.ok) {

                const html =
                    await response.text();

                const doc =
                    new DOMParser()
                        .parseFromString(
                            html,
                            "text/html"
                        );

                const links =
                    [...doc.querySelectorAll("a")];

                samples =
                    links
                        .map(
                            a =>
                                a.getAttribute("href")
                        )
                        .filter(Boolean)
                        .filter(
                            href =>
                                /\.mp3$/i
                                .test(href)
                        )
                        .map(
                            href =>
                                "./samples/" +
                                href
                        );

            }

        }
        catch(e) {
            /*
             * Directory listing may be disabled.
             */
        }

    }


    if (!samples.length) {

        status.textContent =
            "Samples: none found — use ./samples/samples.json";

        sampleScanDone = true;

        return;

    }


    status.textContent =
        `Samples: ${samples.length} found — loading...`;


    for (
        const url of samples
    ) {

        try {

            const response =
                await fetch(
                    url
                );

            if (!response.ok)
                continue;

            const data =
                await response.arrayBuffer();

            const buffer =
                await audioContext.decodeAudioData(
                    data
                );

            sampleBuffers.push(
                buffer
            );

            sampleNames.push(
                decodeURIComponent(
                    url.split("/").pop()
                )
            );

        }
        catch(error) {

            console.warn(
                "Could not load sample:",
                url,
                error
            );

        }

    }


    sampleScanDone = true;

    status.textContent =
        `Samples: ${sampleBuffers.length} loaded`;

}


/* =========================================================
   RANDOM
========================================================= */

function random(min,max) {

    return min +
        Math.random() *
        (max-min);

}


function randomInt(min,max) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );

}


function choose(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}

========================================================= */

/* =========================================================
   AUDIO INITIALISATION
========================================================= */

async function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        master =
            audioContext.createGain();

        master.gain.value =
            0.30;

        cleanMaster =
            audioContext.createGain();

        cleanMaster.gain.value =
            0.80;

        cleanMaster.connect(
            audioContext.destination
        );


        compressor =
            audioContext
                .createDynamicsCompressor();

        compressor.threshold.value =
            -20;

        compressor.knee.value =
            18;

        compressor.ratio.value =
            4;

        compressor.attack.value =
            0.02;

        compressor.release.value =
            0.5;


        delay =
            audioContext.createDelay(
                2
            );

        delay.delayTime.value =
            0.32;


        delayFeedback =
            audioContext.createGain();

        delayFeedback.gain.value =
            0.25;


        /*
         * Synthetic long reverb.
         */

        reverb =
            audioContext.createConvolver();

        reverb.buffer =
            createImpulseResponse(
                8,
                2.2
            );


        master.connect(
            compressor
        );

        compressor.connect(
            audioContext.destination
        );


        /*
         * Effects run in parallel.
         */

        compressor.connect(
            delay
        );

        delay.connect(
            delayFeedback
        );

        delayFeedback.connect(
            delay
        );

        delay.connect(
            audioContext.destination
        );


        compressor.connect(
            reverb
        );

        reverb.connect(
            audioContext.destination
        );

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();

    }

}


function createImpulseResponse(
    seconds,
    decay
) {

    const length =
        Math.floor(
            audioContext.sampleRate *
            seconds
        );

    const buffer =
        audioContext.createBuffer(
            2,
            length,
            audioContext.sampleRate
        );


    for (
        let channel = 0;
        channel < 2;
        channel++
    ) {

        const data =
            buffer.getChannelData(
                channel
            );

        for (
            let i=0;
            i<length;
            i++
        ) {

            const envelope =
                Math.pow(
                    1 -
                    i / length,
                    decay
                );

            data[i] =
                (
                    Math.random()*2-1
                ) *
                envelope;

        }

    }


    return buffer;

}


/* =========================================================
   SOURCE TRACKING / HARD STOP
========================================================= */

function trackSource(source) {

    activeSources.add(source);

    source.addEventListener(
        "ended",
        () => {
            activeSources.delete(source);
        },
        { once:true }
    );

    return source;

}


function stopAllSources() {

    for (const source of activeSources) {

        try {
            source.stop();
        }
        catch(error) {
            /* Already stopped. */
        }

    }

    activeSources.clear();

}


/* =========================================================
   SAMPLE PLAYBACK
========================================================= */

function playRandomSample(
    when
) {

    if (!wetSamplesEnabled.checked)
        return;

    if (!sampleBuffers.length)
        return;

    const chance =
        Number(sampleFrequency.value) / 100;

    if (Math.random() > chance)
        return;

    const sampleIndex =
        randomInt(
            0,
            sampleBuffers.length - 1
        );

    const buffer =
        sampleBuffers[sampleIndex];

    const sampleName =
        sampleNames[sampleIndex] ||
        "UNKNOWN";

    const source = trackSource(
        audioContext.createBufferSource()
    );

    const gain =
        audioContext.createGain();

    const filter =
        audioContext.createBiquadFilter();

    source.buffer = buffer;

    source.playbackRate.value =
        random(0.78,1.18);

    filter.type = "lowpass";
    filter.frequency.value =
        random(900,6500);
    filter.Q.value =
        random(0.5,4);

	//wet sample playback duration
    const duration =
        Math.min(
            buffer.duration / source.playbackRate.value,
            30
        );


    //wet sample volume range
    const level =
        random(0.1,0.40);

    gain.gain.setValueAtTime(
        0.0001,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        level,
        when + Math.min(0.8,duration * 0.25)
    );

    gain.gain.setValueAtTime(
        level,
        when + Math.max(0.9,duration - 2)
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);

    source.addEventListener(
        "ended",
        () => {
            if (currentWetSampleSource === source) {
                currentWetSampleSource = null;
                currentWetSampleName = "NONE";
                updatePlaybackStatus();
            }
        },
        { once:true }
    );

    currentWetSampleSource = source;
    currentWetSampleName = sampleName;

    source.start(when);
    source.stop(when + duration);

    updatePlaybackStatus();

}

/* =========================================================
   CLEAN / FOREGROUND SAMPLE PLAYBACK
========================================================= */

function playCleanSample(
    when
) {

    if (!drySamplesEnabled.checked)
        return;

    if (!sampleBuffers.length)
        return;

    const chance =
        Number(cleanSampleFrequency.value) / 100;

    if (Math.random() > chance)
        return;

    const sampleIndex =
        randomInt(
            0,
            sampleBuffers.length - 1
        );

    const buffer =
        sampleBuffers[sampleIndex];

    const sampleName =
        sampleNames[sampleIndex] ||
        "UNKNOWN";

    const source = trackSource(
        audioContext.createBufferSource()
    );

    const gain =
        audioContext.createGain();

    source.buffer = buffer;

    source.playbackRate.value =
        random(0.92,1.06);

    /*
     * Clean means no atmospheric filter, delay or reverb.
     * It is deliberately foregrounded, but still has a
     * short envelope so it never clicks into existence.
     */
    const duration =
        buffer.duration /
        source.playbackRate.value;

    const fadeIn =
        Math.min(0.12,duration * 0.08);

    const fadeOut =
        Math.min(0.5,duration * 0.18);

    const level =
        random(0.32,0.55);

    gain.gain.setValueAtTime(
        0.0001,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        level,
        when + Math.max(0.02,fadeIn)
    );

    gain.gain.setValueAtTime(
        level,
        when + Math.max(
            fadeIn + 0.02,
            duration - fadeOut
        )
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );

    source.connect(gain);
    gain.connect(cleanMaster);

    source.addEventListener(
        "ended",
        () => {
            if (currentCleanSampleSource === source) {
                currentCleanSampleSource = null;
                currentCleanSampleName = "NONE";
                updatePlaybackStatus();
            }
        },
        { once:true }
    );

    currentCleanSampleSource = source;
    currentCleanSampleName = sampleName;

    source.start(when);
    source.stop(when + duration);

    updatePlaybackStatus();

}

========================================================= */

function midiToFrequency(midi) {

    return 440 *
        Math.pow(
            2,
            (midi - 69) / 12
        );

}

const VOICE_ROLES = {
    brass:  { osc1:"sawtooth", osc2:"sawtooth", osc3:"triangle", detune1:-5, detune2:5, cutoff:1.00, resonance:1.00 },
    rachel: { osc1:"sine",     osc2:"sawtooth", osc3:"triangle", detune1:-3, detune2:3, cutoff:1.55, resonance:0.72 },
    choir:  { osc1:"triangle", osc2:"sine",     osc3:"triangle", detune1:-10,detune2:10,cutoff:0.78, resonance:0.55 },
    drone:  { osc1:"sawtooth", osc2:"triangle", osc3:"sine",     detune1:-2, detune2:2, cutoff:0.62, resonance:0.80 },
    spinner:{ osc1:"square",   osc2:"sawtooth", osc3:"triangle", detune1:-5, detune2:5, cutoff:1.35, resonance:1.45 },
    tears:  { osc1:"triangle", osc2:"sawtooth", osc3:"sine",     detune1:-4, detune2:4, cutoff:0.70, resonance:0.48 },
    scream: { osc1:"sawtooth", osc2:"square",   osc3:"sawtooth", detune1:-12,detune2:12,cutoff:1.80, resonance:2.10 }
};

function playVoice(
    midi,
    when,
    duration,
    velocity = 0.12,
    expressive = true,
    role = "brass"
) {

    const voice = VOICE_ROLES[role] || VOICE_ROLES.brass;

    const frequency =
        midiToFrequency(
            midi
        );


    const osc1 = trackSource(
        audioContext.createOscillator()
    );

    const osc2 = trackSource(
        audioContext.createOscillator()
    );

    const osc3 = trackSource(
        audioContext.createOscillator()
    );


    const filter =
        audioContext.createBiquadFilter();

    const gain =
        audioContext.createGain();


    osc1.type = voice.osc1;
    osc2.type = voice.osc2;
    osc3.type = voice.osc3;


    osc1.frequency.value =
        frequency;

    osc2.frequency.value =
        frequency;

    osc3.frequency.value =
        frequency;


    osc1.detune.value = voice.detune1;
    osc2.detune.value = voice.detune2;
    osc3.detune.value = 0;


    /*
     * Slow pitch instability.
     */

    if (expressive) {

        const lfo = trackSource(
            audioContext.createOscillator()
        );

        const lfoGain =
            audioContext.createGain();

        lfo.frequency.value =
            random(
                0.12,
                0.55
            );

        lfoGain.gain.value =
            random(
                1.5,
                7
            );

        lfo.connect(
            lfoGain
        );

        lfoGain.connect(
            osc1.detune
        );

        lfoGain.connect(
            osc2.detune
        );

        lfo.start(
            when
        );

        lfo.stop(
            when +
            duration +
            2
        );

    }


    /*
     * Filter movement.
     */

    const tensionAmount =
        Number(
            tension.value
        ) / 100;


    const startCutoff =
        (350 + tensionAmount * 1000) * voice.cutoff;


    const peakCutoff =
        (900 + tensionAmount * 6000) * voice.cutoff;


    filter.type =
        "lowpass";

    filter.frequency.setValueAtTime(
        startCutoff,
        when
    );


    filter.frequency.exponentialRampToValueAtTime(
        Math.max(
            250,
            peakCutoff
        ),
        when +
        Math.min(
            duration * 0.65,
            2.5
        )
    );


    filter.frequency.exponentialRampToValueAtTime(
        Math.max(
            220,
            peakCutoff * 0.65
        ),
        when +
        duration
    );


    filter.Q.value =
        (1.5 + tensionAmount * 8) * voice.resonance;


    /*
     * Long expressive envelope.
     */

    const attack =
        0.12 +
        random(
            0,
            0.9
        );


    const release =
        0.7 +
        random(
            0,
            2.2
        );


    const peak =
        velocity *
        (
            0.75 +
            Number(
                activity.value
            ) / 180
        );


    gain.gain.setValueAtTime(
        0.0001,
        when
    );


    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.001,
            peak
        ),
        when + attack
    );


    gain.gain.setValueAtTime(
        peak,
        Math.max(
            when + attack,
            when + duration - release
        )
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );


    /*
     * Expressive pitch bend.
     */

    if (expressive) {

        const bend =
            random(
                -22,
                22
            );


        osc1.detune.setValueAtTime(
            -5 + bend,
            when
        );

        osc1.detune.exponentialRampToValueAtTime(
            -5,
            when + 0.45
        );


        osc2.detune.setValueAtTime(
            5 + bend,
            when
        );

        osc2.detune.exponentialRampToValueAtTime(
            5,
            when + 0.45
        );

    }


    osc1.connect(
        filter
    );

    osc2.connect(
        filter
    );

    osc3.connect(
        filter
    );

    filter.connect(
        gain
    );

    gain.connect(
        master
    );


    osc1.start(
        when
    );

    osc2.start(
        when
    );

    osc3.start(
        when
    );


    const stopTime =
        when +
        duration +
        release +
        0.1;


    osc1.stop(
        stopTime
    );

    osc2.stop(
        stopTime
    );

    osc3.stop(
        stopTime
    );

}


/* =========================================================
   VOICE-LEADING
========================================================= */

function closestNote(
    pitch,
    previous
) {

    let result =
        pitch;

    while (
        result -
        previous >
        6
    ) {

        result -=
            12;

    }

    while (
        previous -
        result >
        6
    ) {

        result +=
            12;

    }

    return result;

}


function makeChord(
    scene,
    chord
) {

    const root =
        scene.root;


    const raw =
        chord.map(
            interval =>
                root +
                interval
        );


    if (!lastChord) {

        return [
            raw[0],
            raw[1] + 12,
            raw[2] + 12
        ];

    }


    const result = [];


    for (
        let i=0;
        i<raw.length;
        i++
    ) {

        result.push(
            closestNote(
                raw[i],
                lastChord[
                    i
                ]
            )
        );

    }


    result.sort(
        (a,b) =>
            a-b
    );


    return result;

}


/* =========================================================
   LONG MUSICAL PHRASES
========================================================= */

/*
 * The phrase is now an actual musical object.
 *
 * Each event has:
 *
 * pitch
 * duration in beats
 * rest
 * accent
 *
 * A small motif is created first, then transformed
 * across several phrase sections.
 */

function generateMotif(
    scene
) {

    const scale =
        scene.scale;


    const motifLength =
        randomInt(
            4,
            8
        );


    const motif = [];


    let currentDegree =
        randomInt(
            0,
            scale.length - 1
        );


    for (
        let i=0;
        i<motifLength;
        i++
    ) {

        /*
         * Mostly small melodic steps.
         */

        const movement =
            choose([
                -2,
                -1,
                0,
                0,
                1,
                1,
                2
            ]);


        currentDegree =
            Math.max(
                0,
                Math.min(
                    scale.length - 1,
                    currentDegree +
                    movement
                )
            );


        motif.push(
            scale[
                currentDegree
            ]
        );

    }


    return motif;

}


function phase2RegisterShift(scene) {

    const tensionAmount = Number(tension.value) / 100;
    const activityAmount = Number(activity.value) / 100;

    const choices =
        tensionAmount > 0.70
        ? [-12, 0, 0, 12, 12]
        : activityAmount < 0.30
            ? [-12, -12, 0, 0, 12]
            : [-12, 0, 0, 0, 12];

    return choose(choices);

}

function phase2Velocity(sectionIndex, sectionCount, eventIndex, eventCount, base) {

    const position =
        (sectionIndex + eventIndex / Math.max(1, eventCount)) /
        Math.max(1, sectionCount);

    /* A broad swell with a little phrase-level variation. */
    const swell =
        0.72 +
        0.48 * Math.sin(Math.PI * position);

    const local =
        0.88 +
        Math.random() * 0.24;

    return base * swell * local;

}

function generatePhrase(
    scene
) {

    const motif =
        generateMotif(
            scene
        );


    const events = [];


    /*
     * 4 to 8 repetitions/variations
     * gives a much longer phrase.
     */

    /* Phase 2: phrase lengths are deliberately less predictable. */
    const sections =
        randomInt(
            3,
            7
        );

    const registerShift = phase2RegisterShift(scene);

    let lastPitch =
        scene.root +
        12 +
        registerShift;


    for (
        let section=0;
        section<sections;
        section++
    ) {

        /* Phase 2: breathe between phrase sections. */
        if (
            section > 0 &&
            Math.random() < 0.42
        ) {
            events.push({
                rest:true,
                beats:choose([0.5, 1, 1.5, 2])
            });
        }

        /*
         * Each section transforms the motif.
         */

        const transpose =
            choose([
                0,
                0,
                0,
                12,
                -12
            ]);


        const reverse =
            section >= 4 &&
            Math.random() <
            0.25;


        const source =
            reverse
            ? [...motif].reverse()
            : motif;


        for (
            let i=0;
            i<source.length;
            i++
        ) {

            /*
             * Silence becomes more likely
             * as activity falls.
             */

            const activityAmount =
                Number(
                    activity.value
                ) / 100;


            if (
                Math.random() >
                0.48 +
                activityAmount * 0.48
            ) {

                events.push({
                    rest:true,
                    beats:
                        choose([
                            0.5,
                            1,
                            1.5
                        ])
                });

                continue;

            }


            let pitch =
                scene.root +
                source[i] +
                transpose +
                registerShift;


            /*
             * Keep the melody around the
             * current register.
             */

            while (
                pitch -
                lastPitch >
                9
            ) {

                pitch -=
                    12;

            }


            while (
                lastPitch -
                pitch >
                9
            ) {

                pitch +=
                    12;

            }


            /*
             * Occasional expressive leap.
             */

            if (
                Math.random() <
                Number(
                    tension.value
                ) / 400
            ) {

                pitch +=
                    choose([
                        -12,
                        12
                    ]);

            }


            const duration =
                choose([
                    0.5,
                    0.75,
                    1,
                    1,
                    1.5,
                    2,
                    2.5,
                    3
                ]);


            events.push({
                pitch,
                beats:duration,
                accent:
                    Math.random() <
                    0.18,
                intensity:
                    phase2Velocity(
                        section,
                        sections,
                        i,
                        source.length,
                        1
                    )
            });


            lastPitch =
                pitch;


            /*
             * Occasionally add a
             * simultaneous harmony tone.
             */

            if (
                Math.random() <
                0.12
            ) {

                events.push({
                    pitch:
                        pitch +
                        choose([
                            3,
                            4,
                            7,
                            12
                        ]),
                    beats:
                        Math.min(
                            duration,
                            2
                        ),
                    accent:false,
                    harmony:true,
                    intensity:0.72
                });

            }

        }

    }


    /*
     * Cadential ending.
     */

    events.push({
        rest:true,
        beats:1
    });


    events.push({
        pitch:
            scene.root +
            12,
        beats:4,
        accent:true
    });


    return events;

}

========================================================= */

const SCORE_CHAPTERS = [
    "introduction",
    "establishment",
    "development",
    "intensification",
    "climax",
    "dissipation",
    "return"
];

function updateLongFormArc() {
    musicalMemory.chapterBar++;

    const activityAmount = Number(activity.value) / 100;
    const tensionAmount = Number(tension.value) / 100;
    const age = musicalMemory.arcAge;

    /* The arc is deliberately slow. It should be felt over many bars,
       not behave like another random bar-by-bar selector. */
    let next = musicalMemory.chapter;

    if (age < 12) {
        next = "introduction";
    } else if (age < 28) {
        next = "establishment";
    } else if (age < 52) {
        next = "development";
    } else if (age < 76) {
        next = "intensification";
    } else if (age < 94) {
        next = "climax";
    } else if (age < 116) {
        next = "dissipation";
    } else {
        next = "return";
    }

    /* User controls can bend the arc without replacing it. */
    if (tensionAmount > 0.82 && age > 36 && age < 92)
        next = age > 60 ? "climax" : "intensification";

    if (activityAmount < 0.20 && age > 70 && age < 116)
        next = "dissipation";

    if (next !== musicalMemory.chapter) {
        musicalMemory.chapter = next;
        musicalMemory.chapterNumber++;
        musicalMemory.chapterBar = 0;

        /* A chapter change develops the existing idea instead of discarding it. */
        if (musicalMemory.motif) {
            musicalMemory.motifUses = Math.min(
                musicalMemory.motifUses,
                1
            );
            musicalMemory.motifGenerations++;
        }
    }

    return musicalMemory.chapter;
}

function longFormProfile() {
    switch (musicalMemory.chapter) {
        case "introduction":
            return { density:0.62, motif:0.78, response:0.18, ostinato:0.22, chromatic:0.05 };
        case "establishment":
            return { density:0.82, motif:0.88, response:0.28, ostinato:0.34, chromatic:0.08 };
        case "development":
            return { density:1.00, motif:1.05, response:0.44, ostinato:0.50, chromatic:0.14 };
        case "intensification":
            return { density:1.12, motif:0.94, response:0.58, ostinato:0.72, chromatic:0.25 };
        case "climax":
            return { density:1.25, motif:0.78, response:0.70, ostinato:0.86, chromatic:0.42 };
        case "dissipation":
            return { density:0.58, motif:0.66, response:0.24, ostinato:0.18, chromatic:0.06 };
        case "return":
            return { density:0.76, motif:1.18, response:0.36, ostinato:0.26, chromatic:0.08 };
        default:
            return { density:1, motif:1, response:0.3, ostinato:0.3, chromatic:0.1 };
    }
}

function longFormMotifMode() {
    switch (musicalMemory.chapter) {
        case "introduction": return "original";
        case "establishment": return choose(["original","fragment","transpose"]);
        case "development": return choose(["fragment","transpose","stretch","answer"]);
        case "intensification": return choose(["transpose","answer","stretch"]);
        case "climax": return choose(["transpose","answer","answer"]);
        case "dissipation": return choose(["fragment","stretch","original"]);
        case "return": return choose(["original","transpose","fragment"]);
        default: return chooseMotifDevelopment();
    }
}

function rememberSource(name) {
    musicalMemory.sourceHistory.push(name);
    if (musicalMemory.sourceHistory.length > 6)
        musicalMemory.sourceHistory.shift();
}

function rememberedSource() {
    return musicalMemory.motif;
}

function chooseMotifDevelopment() {
    return choose([
        "original",
        "original",
        "fragment",
        "transpose",
        "transpose",
        "stretch",
        "answer"
    ]);
}

function chooseVoiceRole() {
    const roles = ["brass", "rachel", "choir", "drone", "spinner", "tears", "scream"];
    const role = roles[musicalMemory.voiceIndex % roles.length];
    musicalMemory.voiceIndex++;
    musicalMemory.lastRole = role;
    return role;
}

function chooseResponseRole(role) {
    const handoff = {
        brass:"rachel", rachel:"choir", choir:"brass",
        drone:"tears", tears:"rachel", spinner:"brass", scream:"choir"
    };
    return handoff[role] || "rachel";
}

function makeCallResponse(source) {
    const callCount = Math.max(4, Math.ceil(source.length * 0.55));
    const call = source.slice(0, callCount).map(e => ({...e}));
    const answer = source.slice(Math.floor(source.length * 0.35)).map(e => ({
        ...e,
        beat: (e.beat - source[Math.floor(source.length * 0.35)].beat) +
              (call[call.length - 1]?.beat || 0) + 1.5,
        midi: e.midi + choose([-5, -2, 2, 5])
    }));
    return { call, answer };
}

function developMidiEvents(source, mode) {
    let events = source.map(e => ({...e}));

    if (mode === "fragment") {
        const count = Math.max(5, Math.floor(events.length * random(0.55, 0.75)));
        events = events.slice(0, count);
    }

    if (mode === "answer") {
        events = events.slice(Math.floor(events.length * 0.25));
    }

    if (mode === "stretch") {
        events = events.map(e => ({
            ...e,
            beat: e.beat * 1.12,
            duration: e.duration * 1.12
        }));
    }

    return events;
}

function chooseRememberedMotif() {
    if (!musicalMemory.motif) return null;
    if (musicalMemory.motifUses >= 3 && Math.random() < 0.65)
        return null;
    return musicalMemory.motif;
}

function rememberMotif(name, source) {
    musicalMemory.motif = {
        name,
        source,
        uses: 0
    };
    musicalMemory.motifUses = 0;
}

function nextHarmonicIndex(scene) {
    if (musicalMemory.harmonyScene !== currentScene) {
        musicalMemory.harmonyScene = currentScene;
        /* Don't restart blindly: begin near the chord implied by the
           last voiced harmony when possible. */
        musicalMemory.lastHarmonyIndex =
            musicalMemory.lastHarmonyIndex % scene.chords.length;
    } else {
        musicalMemory.lastHarmonyIndex =
            (musicalMemory.lastHarmonyIndex + 1) % scene.chords.length;
    }

    return musicalMemory.lastHarmonyIndex;
}

        { beat:8.625, midi:93, duration:0.219 },
        { beat:8.813, midi:87, duration:0.312 }
    ],

    chromaticRun: [
        96,95,94,93,92,91,90,89,88,87,86,85,84,83,82,81,
        80,79,78,77,76,75,74,73,72,71,70,69,68,67,66,65
    ]
};

let midiSourceEventCounter = 0;

function midiSourceRoot(scene) {
    return scene.root + (MIDI_SOURCE.mainMotif[0].midi - 72);
}

function scheduleMidiMainMotif(scene, when, lower=false, forcedMode=null) {

    const baseSource = lower
        ? MIDI_SOURCE.lowerResponse
        : MIDI_SOURCE.mainMotif;

    const remembered = !lower ? chooseRememberedMotif() : null;
    let source = remembered ? remembered.source : baseSource;
    const mode = forcedMode || chooseMotifDevelopment();
    source = developMidiEvents(source, mode);

    const sourceAnchor = source[0].midi;
    const targetAnchor = scene.root + (lower ? 0 : 12);
    const transpose =
        targetAnchor - sourceAnchor +
        choose([-12,0,0,0,12]);

    const beatDuration = 60 / Number(tempo.value);
    const tensionAmount = Number(tension.value) / 100;
    const activityAmount = Number(activity.value) / 100;
    const role = lower ? "drone" : chooseVoiceRole();

    let previousPitch = null;

    source.forEach((event, index) => {
        let pitch = event.midi + transpose;

        pitch = harmonicApproachMidi(
            pitch,
            scene,
            previousPitch
        );

        previousPitch = pitch;

        const duration =
            event.duration * beatDuration * random(0.88,1.08);
        const position = index / Math.max(1, source.length - 1);
        const swell = 0.72 + 0.40 * Math.sin(Math.PI * position);
        const velocity =
            (lower ? 0.040 : 0.068) *
            swell *
            (0.90 + activityAmount * 0.20 + tensionAmount * 0.12) *
            (index === source.length - 1 ? 1.12 : 1);

        playVoice(
            pitch,
            when + event.beat * beatDuration,
            Math.max(0.18,duration),
            velocity,
            true,
            role
        );
    });

    if (!lower) {
        if (!remembered || Math.random() < 0.42)
            rememberMotif("mainMotif", baseSource);
        musicalMemory.motifUses++;
        rememberSource(mode);
        musicalMemory.callResponse = {
            source: baseSource,
            role,
            createdAtBar: bar
        };
    }
}

function scheduleMidiOstinato(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose = scene.root - 43;

    /* Four bars of the source ostinato, with occasional missing steps. */
    for (let step=0; step<64; step++) {

        if (step > 7 && Math.random() < 0.08)
            continue;

        const sourcePitch =
            MIDI_SOURCE.ostinato[step % 4];

        playVoice(
            sourcePitch + transpose,
            when + step * beatDuration * 0.25,
            beatDuration * 0.18,
            0.022 + (step % 4 === 0 ? 0.014 : 0),
            false
        );

    }
}

function scheduleMidiCounterMelody(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.counterMelody;

    /* Put the counter-line below the main phrase and move it by octave
       rather than forcing it to follow every chord. */
    const transpose =
        (scene.root + 7) - source[0].midi +
        choose([-12,0,0,12]);

    let previousPitch = null;

    source.forEach((event,index) => {

        if (index > 7 && Math.random() < 0.14)
            return;

        const pitch = harmonicApproachMidi(
            event.midi + transpose,
            scene,
            previousPitch
        );

        previousPitch = pitch;

        playVoice(
            pitch,
            when + event.beat * beatDuration,
            event.duration * beatDuration * random(0.92,1.06),
            0.032 + (index === 0 ? 0.008 : 0),
            true
        );

    });
}

function scheduleMidiBassMovement(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.bassMovement;
    const transpose = scene.root - source[0];

    source.forEach((midi,index) => {

        playVoice(
            midi + transpose,
            when + index * beatDuration * 0.5,
            beatDuration * random(0.28,0.48),
            0.035 + (index % 2 === 0 ? 0.012 : 0),
            false
        );

    });
}

function scheduleMidiRhythmLayer(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const source = MIDI_SOURCE.rhythmCell;
    const durationShape = MIDI_SOURCE.durationShape;
    const transpose = scene.root + 12;

    let cursor = when;

    for (let i=0; i<source.length; i++) {

        const note =
            transpose +
            choose(scene.scale) +
            choose([0,12]);

        const spacing = source[i] * beatDuration;
        const duration =
            durationShape[i % durationShape.length] *
            beatDuration * 0.12;

        playVoice(
            note,
            cursor,
            Math.max(0.12, Math.min(duration, spacing * 0.8)),
            0.018 + (i === 0 ? 0.012 : 0),
            false
        );

        cursor += spacing;

    }
}

function scheduleMidiExpressive(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose =
        (scene.root + 45) - MIDI_SOURCE.expressiveHigh[0].midi;

    MIDI_SOURCE.expressiveHigh.forEach((event, index) => {

        playVoice(
            event.midi + transpose,
            when + event.beat * beatDuration,
            event.duration * beatDuration * random(0.75,1.15),
            0.025 + (index / MIDI_SOURCE.expressiveHigh.length) * 0.018,
            true
        );

    });
}

function scheduleMidiChromatic(scene, when) {

    const beatDuration = 60 / Number(tempo.value);
    const transpose =
        (scene.root + 48) - MIDI_SOURCE.chromaticRun[0];

    MIDI_SOURCE.chromaticRun.forEach((midi,index) => {

        playVoice(
            midi + transpose,
            when + index * beatDuration * 0.0625,
            beatDuration * 0.075,
            0.012,
            true
        );

    });
}

function scheduleMidiDNA(scene, when) {

    const activityAmount = Number(activity.value) / 100;
    const tensionAmount = Number(tension.value) / 100;
    const profile = sceneProfile(currentScene);
    const arc = longFormProfile();

    /* Activity and Tension control how often the source vocabulary enters.
       Scene personality then biases which vocabulary gets chosen. */
    const sourceChance = Math.min(0.92,
        (0.14 + activityAmount * 0.30 + tensionAmount * 0.18) *
        profile.midi * profile.density * arc.density
    );

    if (bar % 2 !== 0 || Math.random() > sourceChance)
        return;

    midiSourceEventCounter++;

    const remembered = chooseRememberedMotif();

    /* Musical memory: after a new idea has appeared, give it a chance to
       return before introducing another source. The return is developed,
       so memory sounds like recollection rather than MIDI playback. */
    if (remembered && Math.random() < 0.34 * arc.motif) {
        scheduleMidiMainMotif(scene, when, false, longFormMotifMode());
        return;
    }

    const roll = Math.random();
    const cityLike =
        currentScene === "city" ||
        currentScene === "spinner" ||
        currentScene === "replicant";

    if (roll < 0.22 * profile.phrase) {

        scheduleMidiMainMotif(
            scene,
            when,
            currentScene === "replicant" && Math.random() < 0.50
        );

    } else if (roll < 0.40 * profile.phrase) {

        scheduleMidiCounterMelody(scene, when);

    } else if (cityLike && roll < 0.62 * profile.midi) {

        scheduleMidiOstinato(scene, when);

    } else if (roll < 0.78 * profile.midi) {

        scheduleMidiBassMovement(scene, when);

    } else {

        scheduleMidiRhythmLayer(scene, when);
    }

    /* Busy scenes can answer a phrase with a second voice. */
    if (activityAmount > 0.55 && Math.random() < 0.12 + activityAmount * 0.20) {
        scheduleMidiCounterMelody(
            scene,
            when + beatDurationForScore() * choose([2,3,4])
        );
    }

    /* Phase 4B: a remembered call can return as an answer in another voice. */
    if (musicalMemory.callResponse &&
        activityAmount > 0.42 &&
        Math.random() < (0.16 + activityAmount * 0.16) * arc.response) {

        const response = makeCallResponse(musicalMemory.callResponse.source);
        const responseRole = chooseResponseRole(musicalMemory.callResponse.role);
        const responseStart = when + beatDurationForScore() * choose([2,3,4]);
        const anchor = response.answer[0]?.midi || response.source?.[0]?.midi || 72;
        const transpose = (scene.root + choose([7,12,19])) - anchor;

        response.answer.forEach((event,index) => {
            playVoice(
                event.midi + transpose,
                responseStart + event.beat * beatDurationForScore(),
                Math.max(0.16, event.duration * beatDurationForScore() * random(0.88,1.05)),
                0.048 + (index === response.answer.length - 1 ? 0.012 : 0),
                true,
                responseRole
            );
        });

        musicalMemory.callResponse = null;
    }

    /* Phase 5: long-form development can bring the source ostinato forward
       during the build, while keeping it out of the quiet chapters. */
    if ((musicalMemory.chapter === "intensification" ||
         musicalMemory.chapter === "climax") &&
        Math.random() < arc.ostinato * 0.18) {
        scheduleMidiOstinato(scene, when + beatDurationForScore() * 2);
    }

    /* Upper expressive material becomes more probable as tension rises. */
    if (tensionAmount > 0.45 && Math.random() < (tensionAmount - 0.30) * 0.35) {
        scheduleMidiExpressive(
            scene,
            when + beatDurationForScore() * random(0,2)
        );
    }

    /* The chromatic event is deliberately reserved for high tension. */
    if (tensionAmount > 0.80 && Math.random() < 0.20 + arc.chromatic * 0.25) {
        scheduleMidiChromatic(
            scene,
            when + beatDurationForScore() * 2
        );
    }
}

/* =========================================================
   PHASE 6 — HARMONIC ARCHITECTURE
========================================================= */

/*
 * MIDI-derived material remains the source vocabulary, but ordinary
 * melodic events are now gently constrained to the active scene scale.
 * This prevents a transformed motif from accidentally introducing
 * unrelated chromatic notes simply because it was transposed.
 *
 * Chromatic material is deliberately NOT passed through this function;
 * the chromatic layer remains an intentional high-tension colour.
 */
function harmonicSnapMidi(midi, scene) {

    const pitchClass = ((Math.round(midi) % 12) + 12) % 12;

    const allowed = scene.scale.map(
        degree => ((scene.root + degree) % 12 + 12) % 12
    );

    if (allowed.includes(pitchClass))
        return midi;

    let best = midi;
    let bestDistance = Infinity;

    for (const targetClass of allowed) {
        for (let octave=-1; octave<=1; octave++) {
            const candidate =
                midi +
                ((targetClass - pitchClass + 12) % 12) +
                octave * 12;

            const distance = Math.abs(candidate - midi);

            if (distance < bestDistance) {
                best = candidate;
                bestDistance = distance;
            }
        }
    }

    return best;
}


function harmonicApproachMidi(midi, scene, previousMidi=null) {

    let pitch = harmonicSnapMidi(midi, scene);

    if (previousMidi !== null) {
        while (pitch - previousMidi > 7)
            pitch -= 12;

        while (previousMidi - pitch > 7)
            pitch += 12;
    }

    return pitch;
}


function scheduleChapterCadence(scene, when) {

    const chapter = musicalMemory.chapter;

    if (
        musicalMemory.chapterBar !== 1 ||
        !["establishment","development","intensification","climax","dissipation","return"].includes(chapter)
    ) {
        return;
    }

    const beat = beatDurationForScore();
    const root = scene.root;

    /* Quiet fifth-to-root arrival marks a new long-form chapter. */
    playVoice(
        root + 7,
        when,
        beat * 1.8,
        0.035,
        false,
        "tears"
    );

    playVoice(
        root,
        when + beat * 2,
        beat * 3.5,
        0.048,
        false,
        "brass"
    );
}


function beatDurationForScore() {
    return 60 / Number(tempo.value);
}


/* =========================================================
   PHRASE STATE
========================================================= */

let phrase = [];

let phraseIndex = 0;

let phraseTime = 0;


function ensurePhrase(
    scene
) {

    if (
        !phrase.length ||
        phraseIndex >=
        phrase.length
    ) {

        phrase =
            generatePhrase(
                scene
            );

        phraseIndex = 0;

        phraseTime = 0;

    }

}


/* =========================================================
   PLAY PHRASE EVENTS
========================================================= */

function schedulePhrase(
    scene,
    startTime
) {

    ensurePhrase(
        scene
    );


    /*
     * Schedule a substantial section
     * rather than one note.
     */

    let cursor =
        startTime;


    const eventsToSchedule =
        Math.min(
            10,
            phrase.length -
            phraseIndex
        );


    const beatDuration =
        60 /
        Number(
            tempo.value
        );


    for (
        let i=0;
        i<eventsToSchedule;
        i++
    ) {

        const event =
            phrase[
                phraseIndex++
            ];


        const duration =
            event.beats *
            beatDuration;


        if (
            !event.rest
        ) {

            const velocity =
                (event.accent ? 0.17 : 0.10) *
                (event.intensity || 1);

            /* Phase 2: leave a little more space around long notes. */
            const gate =
                event.beats >= 2
                ? random(0.76, 0.92)
                : random(0.84, 0.97);

            playVoice(
                event.pitch,
                cursor,
                Math.max(
                    0.3,
                    duration * gate
                ),
                velocity,
                true
            );

        }


        cursor +=
            duration;

    }

}


/* =========================================================
   CHORD
========================================================= */

function playChord(
    scene,
    when
) {

    const chordIndex = nextHarmonicIndex(scene);
    const chord = scene.chords[chordIndex];


    const voiced =
        makeChord(
            scene,
            chord
        );


    lastChord =
        voiced;


    voiced.forEach(
        (pitch,index) => {

            playVoice(
                pitch,
                when,
                7.5 +
                index * 0.5,
                0.055,
                true
            );

        }
    );

}


/* =========================================================
   DRONE
========================================================= */

function playDrone(
    scene,
    when
) {

    playVoice(
        scene.root - 12,
        when,
        11,
        0.055,
        false
    );

}


/* =========================================================
   PULSE
========================================================= */

function playPulse(
    scene,
    when
) {

    const chance =
        Number(
            activity.value
        ) / 100;


    if (
        Math.random() >
        chance * 0.45
    )
        return;


    const note =
        scene.root +
        choose(
            scene.scale
        );


    playVoice(
        note + 12,
        when,
        choose([
            0.25,
            0.35,
            0.5
        ]),
        0.045,
        false
    );

}


/* =========================================================
   BAR
========================================================= */

function scheduleBar(
    scene,
    when
) {

    const beatDuration = 60 / Number(tempo.value);
    const profile = sceneProfile(currentScene);
    const activityAmount = Number(activity.value) / 100;
    const tensionAmount = Number(tension.value) / 100;
    updateLongFormArc();
    const arc = longFormProfile();

    /*
     * BACKGROUND TUNES
     *
     * This controls the generated musical layer as a whole:
     * chords, phrases, drones, pulses and MIDI-derived material.
     */
    if (backgroundEnabled.checked) {

        scheduleChapterCadence(
            scene,
            when
        );

        /* Harmony becomes more active as tension rises, while the spacious
           scenes leave more room between chord changes. */
        const chordChance = Math.min(0.98,
            profile.chord * (0.42 + tensionAmount * 0.38)
        );

        if (Math.random() < chordChance &&
            (bar % 2 === 0 || tensionAmount > 0.72)) {
            playChord(scene, when);
        }

        /* Activity controls foreground density. */
        const phraseChance = Math.min(1,
            profile.phrase * (0.48 + activityAmount * 0.62)
        );

        if (Math.random() < phraseChance) {
            schedulePhrase(scene, when);
        }

        /* Long drone foundation is strongest in low-activity scenes. */
        const droneChance = Math.min(0.95,
            profile.drone * (0.32 + (1 - activityAmount) * 0.48)
        );

        if (bar % 4 === 0 && Math.random() < droneChance) {
            playDrone(scene, when);
        }

        /* Mechanical pulse becomes a genuine scene characteristic. */
        const pulseChance = Math.min(1,
            profile.pulse * (0.12 + activityAmount * 0.72)
        );

        const pulseCount =
            activityAmount > 0.75 ? 8 :
            activityAmount > 0.42 ? 5 : 2;

        for (let i=0; i<pulseCount; i++) {
            if (Math.random() < pulseChance) {
                playPulse(
                    scene,
                    when + i * beatDuration / 2
                );
            }
        }

        scheduleMidiDNA(scene, when);

        /* During a transition, let the incoming scene appear as a restrained
           harmonic/melodic presence before it takes over completely. */
        if (sceneTransition && sceneTransition.barsRemaining > 0) {

            const incoming = SCENES[sceneTransition.to];
            const transitionStrength =
                (5 - sceneTransition.barsRemaining) / 5;

            /*
             * Do not stack the incoming scene's full chord over the outgoing
             * chord.  Their roots can be unrelated, and the long CS-80 chord
             * envelopes would otherwise overlap and create unintended
             * dissonance.  The transition is carried by the MIDI material
             * instead; the first full incoming chord arrives on its own bar.
             */
            if (Math.random() < transitionStrength * 0.65) {
                scheduleMidiDNA(
                    incoming,
                    when + beatDuration * 2
                );
            }

            sceneTransition.barsRemaining--;

            if (sceneTransition.barsRemaining <= 0) {
                sceneTransition = null;
                phrase = [];
                phraseIndex = 0;
                lastChord = null;
            }
        }
    }

    /* Wet atmospheric samples remain sparse and probabilistic. */
    if (sampleBuffers.length) {
        playRandomSample(
            when + random(0, beatDuration * 4)
        );
    }

    /* Phase 5: keep the global arc moving independently of scene changes. */
    musicalMemory.arcAge++;

    /* Clean foreground samples remain sparse. */
    if (sampleBuffers.length && bar % randomInt(2,8) === 0) {
        playCleanSample(
            when + random(beatDuration * 0.5, beatDuration * 3.5)
        );
    }

    bar++;
}


/* =========================================================
   SCENE CHANGES
========================================================= */

function chooseDifferentScene() {

    const keys =
        Object.keys(
            SCENES
        );


    const choices =
        keys.filter(
            key =>
                key !==
                currentScene
        );


    return choose(
        choices
    );

}


function randomiseControls() {

    activity.value =
        randomInt(
            15,
            80
        );


    tension.value =
        randomInt(
            10,
            85
        );


    tempo.value =
        randomInt(
            40,
            78
        );


    updateUI();

}


function changeScene(
    sceneName,
    randomise=true
) {

    if (!SCENES[sceneName])
        return;

    const previousScene = currentScene;

    /* Random scene changes get a four-bar musical transition. */
    if (running && previousScene !== sceneName) {
        sceneTransition = {
            from: previousScene,
            to: sceneName,
            barsRemaining: 4
        };
    }

    currentScene = sceneName;

    if (randomise)
        randomiseControls();

    phrase = [];
    phraseIndex = 0;
    phraseTime = 0;
    bar = 0;

    /* Keep musical memory across scenes. A motif can therefore return in a
       new register or harmony instead of every scene starting from zero. */
    musicalMemory.motifUses = Math.min(musicalMemory.motifUses, 2);
    musicalMemory.harmonyScene = null;
    musicalMemory.arcSceneCount++;
    musicalMemory.lastChapterScene = sceneName;
    /* Scene changes influence the arc, but do not reset it. */
    musicalMemory.arcAge += 1;

    /* Let an established idea survive several scene changes, but occasionally
       retire it so the score can develop a genuinely new musical identity. */
    if (musicalMemory.arcSceneCount >= 5 && Math.random() < 0.35) {
        musicalMemory.motif = null;
        musicalMemory.motifUses = 0;
        musicalMemory.callResponse = null;
        musicalMemory.arcSceneCount = 0;
    }

    nextSceneAt =
        Date.now() + Number(sceneInterval.value) * 1000;

    updatePlaybackStatus();

}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduler() {

    if (!running)
        return;


    const lookAhead =
        0.20;


    while (
        nextNoteTime <
        audioContext.currentTime +
        lookAhead
    ) {


        /*
         * Random scene mode.
         */

        if (
            sceneSelect.value ===
            "random" &&
            Date.now() >=
            nextSceneAt
        ) {

            changeScene(
                chooseDifferentScene(),
                true
            );

        }


        const scene =
            SCENES[
                currentScene
            ];


        scheduleBar(
            scene,
            nextNoteTime
        );


        const barDuration =
            (
                60 /
                Number(
                    tempo.value
                )
            ) * 4;


        nextNoteTime +=
            barDuration;

    }


    meter.style.width =
        `${
            8 +
            Math.random() *
            Number(
                activity.value
            )
        }%`;


    schedulerTimer =
        setTimeout(
            scheduler,
            30
        );

}


/* =========================================================
   START
========================================================= */

async function startScore() {

    await initAudio();

    master.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    master.gain.setValueAtTime(
        0.30,
        audioContext.currentTime
    );

    cleanMaster.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    cleanMaster.gain.setValueAtTime(
        0.80,
        audioContext.currentTime
    );


    /*
     * Load samples after the AudioContext
     * exists, but don't block playback.
     */

    if (
        !sampleScanDone
    ) {

        loadSamples();

    }


    running = true;


    startButton.textContent =
        "STOP INFINITE SCORE";


    status.classList.add(
        "playing"
    );


    /*
     * Random is deliberately the default.
     */

    if (
        sceneSelect.value ===
        "random"
    ) {

        changeScene(
            chooseDifferentScene(),
            true
        );

    }
    else {

        changeScene(
            sceneSelect.value,
            false
        );

    }


    nextNoteTime =
        audioContext.currentTime +
        0.10;


    scheduler();

}


/* =========================================================
   STOP
========================================================= */

function stopScore() {

    running = false;

    if (schedulerTimer) {

        clearTimeout(
            schedulerTimer
        );

        schedulerTimer = null;

    }

    /*
     * Cancel everything already scheduled. AudioScheduledSourceNode.stop()
     * with no argument stops an already-started source immediately, and a
     * source scheduled for the future will never begin if its stop occurs
     * first.
     */
    stopAllSources();

    if (audioContext) {

        const now =
            audioContext.currentTime;

        if (master) {
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(0,now);
        }

        if (cleanMaster) {
            cleanMaster.gain.cancelScheduledValues(now);
            cleanMaster.gain.setValueAtTime(0,now);
        }

    }

    nextNoteTime = 0;
    bar = 0;
    lastChord = null;

    currentWetSampleSource = null;
    currentCleanSampleSource = null;
    currentWetSampleName = "NONE";
    currentCleanSampleName = "NONE";

    startButton.textContent =
        "START INFINITE SCORE";

    status.textContent =
        "STOPPED";

    status.classList.remove(
        "playing"
    );

    meter.style.width =
        "0%";

}

/* =========================================================
   START / STOP BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        if (
            running
        ) {

            stopScore();

        }
        else {

            try {

                await startScore();

            }
            catch(error) {

                console.error(
                    error
                );

                running = false;

                startButton.textContent =
                    "START INFINITE SCORE";

                status.textContent =
                    "ERROR: " +
                    error.message;

            }

        }

    }
);


/* =========================================================
   NEW SCENE
========================================================= */

document
    .getElementById(
        "newSceneButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                sceneSelect.value ===
                "random"
            ) {

                changeScene(
                    chooseDifferentScene(),
                    true
                );

            }
            else {

                changeScene(
                    sceneSelect.value,
                    false
                );

            }

        }
    );


/* =========================================================
   MANUAL SCENE SELECTION
========================================================= */

sceneSelect.addEventListener(
    "change",
    () => {

        if (
            sceneSelect.value ===
            "random"
        ) {

            changeScene(
                chooseDifferentScene(),
                true
            );

        }
        else {

            changeScene(
                sceneSelect.value,
                false
            );

        }

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

changeScene(
    "rain",
    false
);

</script>

</body>
</html>
